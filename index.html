<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On It</title>
  
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="On It">

  <link rel="manifest" id="manifestLink">

  <style>
    :root {
      --font-main: "Trebuchet MS", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: #fff;
      font-family: var(--font-main);
    }

    body {
      min-height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .onit-page,
    .timer-page {
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .onit-page > *,
    .timer-page > * {
      position: relative;
      z-index: 1;
    }

    .background-readable {
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000,
         0   -1px 0 #000,
         0    1px 0 #000,
        -1px  0   0 #000,
         1px  0   0 #000;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      display: flex;
      align-items: center;
      padding: 18px 24px;
      background: transparent;
      border: none;
      z-index: 900;
      pointer-events: none;
    }

    .menu-button {
      background: none;
      border: none;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      padding: 0;
      margin: 0;
      pointer-events: auto;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    }

    .header-title { display: none; }

    .side-menu {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background: #181818;
      padding: 60px 20px 20px;
      transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      border-right: 1px solid #2a2a2a;
    }

    .side-menu.open { left: 0; }

    .menu-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #888;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .menu-close-btn:hover { color: #fff; }

    .side-menu button.menu-item {
      width: 100%;
      padding: 16px 12px;
      margin-bottom: 8px;
      background: none;
      border: none;
      color: #fff;
      text-align: left;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
    }

    .side-menu button.menu-item:hover { background: #252525; }

    .tag-selector-wrapper,
    .preset-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 380px;
    }

    .tag-chips,
    .preset-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      max-height: 150px;
      overflow-y: auto;
      width: 100%;
    }

    .tag-chip,
    .preset-btn {
      padding: 6px 12px;
      background: rgba(15, 15, 15, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 16px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: none;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag-chip:hover,
    .preset-btn:hover {
      background: rgba(40, 40, 40, 0.9);
      border-color: #fff;
    }

    .tag-chip.selected {
      background: rgba(255, 255, 255, 0.95);
      border-color: #fff;
      color: #111;
      font-weight: 600;
      text-shadow: none;
      box-shadow: none;
    }

    .preset-del-btn {
      font-size: 11px;
      color: #ccc;
      cursor: pointer;
      margin-left: 2px;
      text-shadow: none;
    }

    .preset-del-btn:hover { color: #ff6b6b; }

    .preset-add-btn {
      padding: 6px 12px;
      background: rgba(15, 15, 15, 0.75);
      border: 1px dashed rgba(255, 255, 255, 0.5);
      border-radius: 15px;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      box-shadow: none;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    }

    .preset-add-btn:hover {
      border-color: #fff;
      background: rgba(40, 40, 40, 0.9);
    }

    .controls {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .control-button {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: linear-gradient(145deg, #232323, #161616);
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .control-button:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.3);
      background: linear-gradient(145deg, #2d2d2d, #1a1a1a);
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
    }

    .control-button:active {
      transform: translateY(1px);
      box-shadow: 0 3px 8px rgba(0,0,0,0.5);
    }

    /* 스타일리시한 노란색 형광 글로우 (세모 버튼 활성화 시) */
    .control-button.active-glow-play {
      border-color: rgba(255, 230, 80, 0.9);
      background: linear-gradient(145deg, #3a351a, #222012);
      box-shadow: 0 0 25px rgba(255, 220, 50, 0.55), inset 0 0 12px rgba(255, 220, 50, 0.25);
      color: #ffe650;
    }

    /* 스타일리시한 하늘색 형광 글로우 (일시정지 버튼 활성화 시) */
    .control-button.active-glow-pause {
      border-color: rgba(80, 210, 255, 0.9);
      background: linear-gradient(145deg, #1a323a, #121c22);
      box-shadow: 0 0 25px rgba(50, 200, 255, 0.55), inset 0 0 12px rgba(50, 200, 255, 0.25);
      color: #50d2ff;
    }

    .session-time {
      font-size: 72px;
      font-weight: 300;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .total-label {
      font-size: 16px;
      color: #fff;
      margin-bottom: 6px;
    }

    .total-time {
      font-size: 32px;
      font-weight: 300;
      margin-bottom: 20px;
    }

    .timer-inputs-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .timer-inputs {
      display: flex;
      gap: 12px;
    }

    .timer-input {
      width: 70px;
      height: 64px;
      background: rgba(15, 15, 15, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 14px;
      color: #fff;
      font-size: 24px;
      font-weight: 300;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    }

    .timer-input:focus { border-color: #fff; }

    .timer-remaining {
      font-size: 72px;
      font-weight: 300;
      letter-spacing: 1px;
      margin-bottom: 5px;
      transition: opacity 0.15s;
    }

    .timer-phase-info {
      font-size: 22px;
      color: #ddd;
      margin-bottom: 25px;
      font-weight: 300;
    }

    .text-flash { opacity: 0.1 !important; }

    .records-page {
      min-height: 100vh;
      padding: 80px 24px 40px;
      max-width: 700px;
      margin: 0 auto;
    }

    .records-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .records-toolbar button {
      padding: 9px 13px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1c1c1c;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .records-toolbar button:hover { background: #252525; }

    .records-toolbar button.btn-reset {
      border-color: rgba(255, 85, 85, 0.3);
      color: #ff6b6b;
    }

    .records-toolbar button.btn-reset:hover {
      background: rgba(255, 85, 85, 0.15);
      border-color: #ff5555;
    }

    #csvFileInput { display: none; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .summary-card {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
    }

    .summary-card-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
    }

    .summary-card-value {
      font-size: 18px;
      font-weight: 300;
      color: #fff;
    }

    .ratio-stats-box {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .ratio-stats-box details summary {
      font-size: 15px;
      color: #aaa;
      cursor: pointer;
      outline: none;
      user-select: none;
    }

    .ratio-stats-box details summary:hover {
      color: #fff;
    }

    .ratio-stats-content {
      margin-top: 14px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .ratio-item {
      margin-bottom: 10px;
    }

    .ratio-item:last-child { margin-bottom: 0; }

    .ratio-info-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
      color: #ccc;
    }

    .ratio-bar-bg {
      width: 100%;
      height: 6px;
      background: #252525;
      border-radius: 3px;
      overflow: hidden;
    }

    .ratio-bar-fill {
      height: 100%;
      background: #888;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .tag-manage-box {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .tag-manage-title {
      font-size: 15px;
      color: #aaa;
      margin-bottom: 10px;
    }

    .tag-manage-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-manage-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: #252525;
      border: 1px solid #333;
      border-radius: 14px;
      font-size: 13px;
      color: #fff;
    }

    .tag-manage-item span.del {
      color: #888;
      cursor: pointer;
      font-size: 11px;
    }
    .tag-manage-item span.del:hover { color: #ff6b6b; }

    .tag-add-input-group {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .tag-add-input-group input {
      flex: 1;
      padding: 6px 10px;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .tag-add-input-group button {
      padding: 6px 12px;
      background: #333;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .tag-add-input-group button:hover { background: #444; }

    .tag-filter-wrapper {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tag-filter-select {
      width: 100%;
      padding: 10px 12px;
      background: #181818;
      border: 1px solid #292929;
      color: #fff;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    .filter-options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #aaa;
      padding: 0 4px;
    }

    .filter-options-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .records-list { margin-top: 10px; }

    .record-date-container {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 25px;
      margin-bottom: 10px;
      border-bottom: 1px solid #222;
      padding-bottom: 5px;
    }

    .record-date {
      font-size: 18px;
      color: #888;
    }

    .record-date-total {
      font-size: 14px;
      color: #aaa;
      font-weight: 400;
    }

    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #1a1a1a;
      gap: 15px;
    }

    .record-main-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .record-row-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .record-time { font-size: 20px; }

    .record-type {
      color: #888;
      font-size: 13px;
      background: #222;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .record-memo {
      color: #ddd;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      width: fit-content;
    }

    .record-actions {
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    .record-actions button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 18px;
      cursor: pointer;
    }

    .record-actions button:hover { color: #fff; }

    .empty-records {
      color: #666;
      font-size: 16px;
      margin-top: 40px;
      text-align: center;
    }

    .settings-page {
      min-height: 100vh;
      padding: 80px 24px 40px;
      max-width: 700px;
      margin: 0 auto;
    }

    .settings-section { margin-top: 35px; }
    .settings-section:first-child { margin-top: 10px; }

    .settings-title {
      font-size: 20px;
      margin-bottom: 18px;
    }

    .settings-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid #222;
      gap: 20px;
    }

    .settings-option-label { font-size: 18px; }

    .settings-option button {
      min-width: 120px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1c1c1c;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .settings-option button:hover { background: #252525; }

    .settings-option button.selected {
      border-color: #777;
      background: #2a2a2a;
    }

    .settings-current {
      color: #999;
      font-size: 14px;
      margin-top: 10px;
    }

    .background-settings {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid #222;
    }

    .background-preview-name {
      color: #999;
      font-size: 14px;
      margin: 10px 0 16px;
      word-break: break-all;
    }

    .background-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .background-buttons button {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1c1c1c;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .background-buttons button:hover { background: #252525; }

    #backgroundFileInput { display: none; }



    /* ===== Time Log ===== */
    .timelog-page {
      min-height: 100vh;
      padding: 80px 20px 40px;
      max-width: 700px;
      margin: 0 auto;
      background: #111;
      color: #fff;
    }

    .timelog-datebar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .timelog-datebar button,
    .timelog-toolbar button,
    .timelog-data-actions button {
      border: 1px solid #333;
      background: #1c1c1c;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
    }

    .timelog-datebar button { padding: 8px 11px; font-size: 14px; }
    .timelog-datebar button:disabled { opacity: .35; cursor: default; }
    .timelog-date-label { min-width: 180px; text-align: center; font-size: 17px; color: #ddd; }

    .timelog-toolbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .timelog-toolbar button {
      padding: 11px 8px;
      font-size: 17px;
      font-weight: 700;
      transition: all .15s ease;
    }

    .timelog-toolbar button.active { outline: 2px solid rgba(255,255,255,.35); outline-offset: 1px; }
    .timelog-tool-o { color: #ff7a3d !important; }
    .timelog-tool-i { color: #59a8ff !important; font-family: Georgia, 'Times New Roman', serif; }
    .timelog-tool-x { color: #87917a !important; }
    .timelog-tool-erase { color: #ddd !important; }

    .timelog-grid-wrap {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .timelog-minutes-head, .timelog-row {
      display: grid;
      grid-template-columns: 38px repeat(6, 1fr) 38px;
      gap: 4px;
      align-items: center;
    }

    .timelog-minutes-head { margin-bottom: 5px; color: #777; font-size: 11px; text-align: center; }
    .timelog-hour { color: #8f8f8f; font-size: 13px; text-align: right; padding-right: 6px; }
    .timelog-hour-right { text-align: left; padding-right: 0; padding-left: 2px; }
    .timelog-cell {
      height: 24px;
      border: 1px solid #303030;
      border-radius: 4px;
      background: #151515;
      cursor: pointer;
      transition: background .08s ease, border-color .08s ease;
    }
    .timelog-cell.o { background: #d95d25; border-color: #ee7540; }
    .timelog-cell.i { background: #2d6faa; border-color: #4a8dcc; }
    .timelog-cell.x { background: #59604f; border-color: #727c64; }
    .timelog-cell.future-locked { opacity: .32; cursor: default; }

    .timelog-stats {
      display: grid;
      gap: 8px;
      margin-bottom: 15px;
    }
    .timelog-stat-row {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 10px;
      padding: 11px 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .timelog-stat-label { color: #888; min-width: 64px; }
    .timelog-stat-values { display: flex; gap: 12px; flex-wrap: wrap; }
    .timelog-stat-values span { white-space: nowrap; }
    .timelog-stat-o { color: #ff8a55; }
    .timelog-stat-i { color: #69b4ff; }
    .timelog-stat-x { color: #98a18d; }

    .timelog-data-box {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #222;
    }
    .timelog-data-title { font-size: 16px; color: #aaa; margin-bottom: 10px; }
    .timelog-data-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .timelog-data-actions button { padding: 9px 12px; font-size: 13px; }
    .timelog-data-actions .danger { color: #ff6b6b; border-color: rgba(255,85,85,.35); }
    #timelogCsvInput { display: none; }

    /* ===== Refined Focus UI: On It + Timer running ===== */
    .session-time,
    .timer-remaining {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      letter-spacing: 0.02em;
      line-height: 1;
      font-weight: 300;
      text-shadow: 0 2px 14px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.95);
    }

    .session-time {
      font-size: clamp(64px, 8vw, 104px);
      margin-bottom: 18px;
    }

    .timer-remaining {
      font-size: clamp(64px, 8vw, 104px);
      margin-bottom: 18px;
    }

    .focus-subinfo {
      margin-bottom: 30px;
      color: rgba(255,255,255,.92);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
      text-shadow:
        0 1px 2px rgba(0,0,0,1),
        0 2px 8px rgba(0,0,0,.98),
        0 0 1px rgba(0,0,0,1);
    }

    .timer-phase-info {
      margin-bottom: 30px;
      color: rgba(255,255,255,.92);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: .14em;
      text-shadow:
        0 1px 2px rgba(0,0,0,1),
        0 2px 8px rgba(0,0,0,.98),
        0 0 1px rgba(0,0,0,1);
    }

    .controls {
      gap: 12px;
      padding: 8px;
      margin-top: 0;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(9,9,9,.34);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0,0,0,.24);
    }

    .control-button {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.055);
      box-shadow: none;
      color: rgba(255,255,255,.92);
      font-size: 19px;
      transition: transform .16s ease, background .16s ease, border-color .16s ease, color .16s ease, box-shadow .16s ease;
    }

    .control-button:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.24);
      background: rgba(255,255,255,.10);
      box-shadow: none;
    }

    .control-button:active {
      transform: scale(.97);
      box-shadow: none;
    }

    .control-button.active-glow-play {
      border-color: rgba(255,210,72,.68);
      background: rgba(255,204,56,.10);
      color: #ffd95a;
      box-shadow: 0 0 18px rgba(255,210,72,.18);
    }

    .control-button.active-glow-pause {
      border-color: rgba(92,195,255,.68);
      background: rgba(76,184,255,.10);
      color: #77d0ff;
      box-shadow: 0 0 18px rgba(76,184,255,.18);
    }


    /* Timer setup: keep the standalone play control visible even on bright backgrounds. */
    .timer-setup-play {
      background: rgba(10,10,10,.62);
      border-color: rgba(255,255,255,.34);
      color: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,.52), 0 0 0 1px rgba(0,0,0,.28);
      text-shadow: 0 1px 3px rgba(0,0,0,1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .timer-setup-play:hover {
      background: rgba(18,18,18,.72);
      border-color: rgba(255,255,255,.48);
      box-shadow: 0 6px 18px rgba(0,0,0,.58), 0 0 0 1px rgba(0,0,0,.32);
    }

    @media (max-width: 600px) {
      header { padding: 14px 18px; }
      .session-time { font-size: 56px; }
      .total-time { font-size: 28px; }
      .timer-remaining { font-size: 56px; }
      .timer-input { width: 58px; height: 56px; font-size: 20px; }
      .control-button { width: 62px; height: 62px; font-size: 20px; }
      .summary-card-value { font-size: 15px; }
      .timelog-page { padding: 70px 12px 30px; }
      .timelog-grid-wrap { padding: 10px 8px; }
      .timelog-minutes-head, .timelog-row { grid-template-columns: 34px repeat(6, 1fr) 34px; gap: 3px; }
      .timelog-cell { height: 23px; }
      .timelog-date-label { min-width: 155px; font-size: 15px; }
    }
  </style>
</head>

<body>

  <header>
    <button class="menu-button" onclick="toggleMenu()">☰</button>
    <div class="header-title" id="headerTitle">On It</div>
  </header>

  <nav class="side-menu" id="sideMenu">
    <button class="menu-close-btn" onclick="closeMenu()">✕</button>
    <button class="menu-item" onclick="showOnIt()">On It</button>
    <button class="menu-item" onclick="showTimer()">Timer</button>
    <button class="menu-item" onclick="showRecords()">Records</button>
    <button class="menu-item" onclick="showTimeLog()">Time Log</button>
    <button class="menu-item" onclick="showSettings()">Settings</button>
  </nav>

  <main class="onit-page" id="onitPage">
    <div class="tag-selector-wrapper" id="onitTagWrapper">
      <div class="tag-chips" id="onitTagChips"></div>
    </div>

    <div class="session-time background-readable" id="sessionTime">00:00:00</div>
    <div class="focus-subinfo background-readable" id="totalTime">TODAY · 0.0h</div>

    <div class="controls">
      <button class="control-button" id="onitPlayBtn" onclick="startSession()">▶</button>
      <button class="control-button" id="onitPauseBtn" onclick="pauseSession()">Ⅱ</button>
      <button class="control-button" onclick="stopSession()">■</button>
    </div>
  </main>

  <section class="timer-page" id="timerPage" style="display: none;"></section>

  <section class="records-page" id="recordsPage" style="display: none;">
    <div class="records-toolbar">
      <button onclick="triggerImportCSV()">CSV 불러오기</button>
      <button onclick="exportRecordsCSV()">CSV 내보내기</button>
      <button class="btn-reset" onclick="clearAllRecords()">모든 기록 초기화</button>
    </div>
    <input type="file" id="csvFileInput" accept=".csv" onchange="importRecordsCSV(this)">

    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-card-label">Today</div>
        <div class="summary-card-value" id="todayTotalValue">0분</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-label">This Week</div>
        <div class="summary-card-value" id="weekTotalValue">0분</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-label">This Month</div>
        <div class="summary-card-value" id="monthTotalValue">0분</div>
      </div>
    </div>

    <div class="ratio-stats-box">
      <details>
        <summary>태그별 누적 시간 및 비율 (클릭하여 펼치기)</summary>
        <div class="ratio-stats-content" id="ratioStatsList"></div>
      </details>
    </div>

    <div class="tag-filter-wrapper">
      <select id="recordTagFilter" class="tag-filter-select" onchange="renderRecords()">
        <option value="ALL">모든 태그 (전체 보기)</option>
      </select>
      <div class="filter-options-row">
        <label>
          <input type="checkbox" id="currentMonthOnlyCheckbox" checked onchange="renderRecords()"> 이번 달만 보기
        </label>
      </div>
    </div>

    <div class="records-list" id="recordsList"></div>
  </section>



  <section class="timelog-page" id="timeLogPage" style="display: none;">
    <div class="timelog-datebar">
      <button onclick="changeTimeLogDate(-1)" aria-label="이전 날짜">‹</button>
      <div class="timelog-date-label" id="timelogDateLabel"></div>
      <button id="timelogNextBtn" onclick="changeTimeLogDate(1)" aria-label="다음 날짜">›</button>
      <button onclick="goTimeLogToday()">오늘</button>
    </div>

    <div class="timelog-toolbar">
      <button class="timelog-tool-o active" id="timelogToolO" onclick="setTimeLogTool('O')">O</button>
      <button class="timelog-tool-i" id="timelogToolI" onclick="setTimeLogTool('I')">I</button>
      <button class="timelog-tool-x" id="timelogToolX" onclick="setTimeLogTool('X')">X</button>
      <button class="timelog-tool-erase" id="timelogToolErase" onclick="setTimeLogTool('')">🧽</button>
    </div>

    <div class="timelog-grid-wrap" id="timelogGrid"></div>

    <div class="timelog-stats">
      <div class="timelog-stat-row">
        <span class="timelog-stat-label" id="timelogDayStatLabel">선택일</span>
        <div class="timelog-stat-values" id="timelogDayStats"></div>
      </div>
      <div class="timelog-stat-row">
        <span class="timelog-stat-label">이번 주</span>
        <div class="timelog-stat-values" id="timelogWeekStats"></div>
      </div>
      <div class="timelog-stat-row">
        <span class="timelog-stat-label">이번 달</span>
        <div class="timelog-stat-values" id="timelogMonthStats"></div>
      </div>
    </div>

    <div class="timelog-data-box">
      <div class="timelog-data-title">데이터 관리</div>
      <div class="timelog-data-actions">
        <button onclick="exportTimeLogCSVs()">CSV 내보내기</button>
        <button onclick="triggerTimeLogImport()">CSV 가져오기</button>
        <button class="danger" onclick="clearAllTimeLogRecords()">전체 기록 삭제</button>
      </div>
      <input type="file" id="timelogCsvInput" accept=".csv" onchange="importTimeLogCSV(this)">
    </div>
  </section>

  <section class="settings-page" id="settingsPage" style="display: none;">
    <div class="settings-section">
      <div class="settings-title">작업 태그 관리</div>
      <div class="tag-manage-box">
        <div class="tag-manage-list" id="tagManageList"></div>
        <div class="tag-add-input-group">
          <input type="text" id="newTagNameInput" placeholder="새 고정 태그 입력...">
          <button onclick="addNewTag()">추가</button>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-title">Alert</div>

      <div class="settings-option">
        <div class="settings-option-label">Screen flashing</div>
        <button id="flashAlertButton" onclick="setAlertMode('flash')">Select</button>
      </div>

      <div class="settings-option">
        <div class="settings-option-label">Sound</div>
        <button id="soundAlertButton" onclick="setAlertMode('sound')">Select</button>
      </div>

      <div class="settings-current" id="currentAlertText">
        Current: Screen flashing
      </div>
    </div>

    <div class="settings-section background-settings">
      <div class="settings-title">Background</div>

      <div class="background-preview-name" id="backgroundCurrentText">None</div>

      <div class="background-buttons">
        <button onclick="selectBackgroundImage()">Choose image</button>
        <button onclick="removeBackgroundImage()">Remove</button>
      </div>

      <input id="backgroundFileInput" type="file" accept="image/*" onchange="handleBackgroundFile(this)">
    </div>
  </section>

  <script>
    function initPWA() {
      const manifestData = {
        name: "On It",
        short_name: "OnIt",
        start_url: "./",
        display: "standalone",
        background_color: "#111111",
        theme_color: "#111111",
        icons: [{
          src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b0b0b'/><text x='50' y='53' text-anchor='middle' font-family='Arial,sans-serif' font-size='25' font-weight='700' letter-spacing='1'><tspan fill='%23ffffff'>ON </tspan><tspan fill='%23ff6a2a'>IT</tspan></text><rect x='31' y='66' width='38' height='4' rx='2' fill='%23ff6a2a'/></svg>",
          sizes: "192x192 512x512",
          type: "image/svg+xml"
        }]
      };

      const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: "application/json" });
      document.getElementById("manifestLink").href = URL.createObjectURL(manifestBlob);

      if ("serviceWorker" in navigator) {
        const swCode = `
          const CACHE_NAME = 'onit-v40-cache';
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => e.waitUntil(clients.claim()));
          self.addEventListener('fetch', e => {
            e.respondWith(
              fetch(e.request).catch(() => caches.match(e.request))
            );
          });
        `;
        const swBlob = new Blob([swCode], { type: "text/javascript" });
        const swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      }
    }

    const DEFAULT_TAGS = ["탐색", "설계", "생성", "편집", "IN"];
    let activeTag = localStorage.getItem("onItActiveTag") || "On It";

    function getCustomTags() {
      return JSON.parse(localStorage.getItem("onItCustomTags")) || DEFAULT_TAGS;
    }

    function saveCustomTags(tags) {
      localStorage.setItem("onItCustomTags", JSON.stringify(tags));
    }

    function renderTagChips() {
      const container = document.getElementById("onitTagChips");
      if (!container) return;
      const tags = getCustomTags();

      container.innerHTML = tags.map(t => `
        <button class="tag-chip ${activeTag === t ? 'selected' : ''}" onclick="selectActiveTag('${t}')">${t}</button>
      `).join("");
    }

    function selectActiveTag(tag) {
      activeTag = tag;
      localStorage.setItem("onItActiveTag", activeTag);
      renderTagChips();
      renderTimerTagChips();
    }

    function renderTagManagerUI() {
      const list = document.getElementById("tagManageList");
      if (!list) return;
      const tags = getCustomTags();

      list.innerHTML = tags.map(t => `
        <div class="tag-manage-item">
          ${t}
          ${tags.length > 1 ? `<span class="del" onclick="deleteTag('${t}')">✕</span>` : ''}
        </div>
      `).join("");
    }

    function addNewTag() {
      const input = document.getElementById("newTagNameInput");
      const val = input.value.trim();
      if (!val) return;

      let tags = getCustomTags();
      if (tags.includes(val)) {
        alert("이미 존재하는 태그입니다.");
        return;
      }

      tags.push(val);
      saveCustomTags(tags);
      input.value = "";
      renderTagManagerUI();
      renderTagChips();
      renderTimerTagChips();
    }

    function deleteTag(tag) {
      let tags = getCustomTags();
      if (tags.length <= 1) {
        alert("최소 하나의 태그는 유지되어야 합니다.");
        return;
      }

      tags = tags.filter(t => t !== tag);
      saveCustomTags(tags);

      if (activeTag === tag) {
        activeTag = tags[0];
        localStorage.setItem("onItActiveTag", activeTag);
      }

      renderTagManagerUI();
      renderTagChips();
      renderTimerTagChips();
    }

    function getToday() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}.${month}.${day}`;
    }

    function formatOnIt(seconds) {
      seconds = Math.max(0, Math.floor(Number(seconds) || 0));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function formatTodayHours(seconds) {
      seconds = Math.max(0, Number(seconds) || 0);
      return `TODAY · ${(seconds / 3600).toFixed(1)}h`;
    }

    function formatRecordText(seconds) {
      seconds = Math.max(0, Math.floor(Number(seconds) || 0));
      if (seconds === 0) return "0분";

      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;

      let result = "";
      if (hours > 0) result += `${hours}시간 `;
      if (minutes > 0 || hours > 0) {
        result += `${minutes}분`;
      } else if (secs > 0) {
        result += `0분 ${secs}초`;
      }
      return result.trim();
    }

    function formatDayTotalText(seconds) {
      seconds = Math.max(0, Math.floor(Number(seconds) || 0));
      if (seconds === 0) return "0시간";
      
      const hoursDecimal = (seconds / 3600).toFixed(1);
      return `${hoursDecimal}시간`;
    }

    function formatTimer(seconds) {
      seconds = Math.max(0, Math.floor(Number(seconds) || 0));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;

      return (
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(secs).padStart(2, "0")
      );
    }

    const BACKGROUND_DB_NAME = "OnItBackgroundDB";
    const BACKGROUND_STORE_NAME = "background";
    const BACKGROUND_KEY = "current";
    let currentBackgroundUrl = null;

    function openBackgroundDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error("IndexedDB 지원 불가"));
          return;
        }
        const request = indexedDB.open(BACKGROUND_DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(BACKGROUND_STORE_NAME)) {
            db.createObjectStore(BACKGROUND_STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function updateBackgroundCurrentText(text) {
      const el = document.getElementById("backgroundCurrentText");
      if (el) el.textContent = text;
    }

    async function loadBackgroundImage() {
      try {
        const db = await openBackgroundDB();
        const tx = db.transaction(BACKGROUND_STORE_NAME, "readonly");
        const store = tx.objectStore(BACKGROUND_STORE_NAME);
        const request = store.get(BACKGROUND_KEY);

        request.onsuccess = () => {
          const file = request.result;
          db.close();

          if (currentBackgroundUrl) {
            URL.revokeObjectURL(currentBackgroundUrl);
            currentBackgroundUrl = null;
          }

          if (!file) {
            updateBackgroundCurrentText("None");
            applyBackgroundToCurrentPage();
            return;
          }

          currentBackgroundUrl = URL.createObjectURL(file);
          updateBackgroundCurrentText(file.name || "Selected image");
          applyBackgroundToCurrentPage();
        };
      } catch (err) {
        updateBackgroundCurrentText("None");
      }
    }

    function applyBackgroundToCurrentPage() {
      const bg = currentBackgroundUrl ? `url("${currentBackgroundUrl}")` : "none";
      const onitPage = document.getElementById("onitPage");
      const timerPage = document.getElementById("timerPage");
      if (onitPage) onitPage.style.backgroundImage = bg;
      if (timerPage) timerPage.style.backgroundImage = bg;
    }

    function selectBackgroundImage() {
      document.getElementById("backgroundFileInput").click();
    }

    async function handleBackgroundFile(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      try {
        const db = await openBackgroundDB();
        const tx = db.transaction(BACKGROUND_STORE_NAME, "readwrite");
        const store = tx.objectStore(BACKGROUND_STORE_NAME);
        await store.put(file, BACKGROUND_KEY);
        db.close();
        await loadBackgroundImage();
      } catch (e) {
        alert("배경 이미지 저장에 실패했습니다.");
      }
      input.value = "";
    }

    async function removeBackgroundImage() {
      if (!confirm("배경 이미지를 삭제하시겠습니까?")) return;
      try {
        const db = await openBackgroundDB();
        const tx = db.transaction(BACKGROUND_STORE_NAME, "readwrite");
        tx.objectStore(BACKGROUND_STORE_NAME).delete(BACKGROUND_KEY);
        db.close();

        if (currentBackgroundUrl) {
          URL.revokeObjectURL(currentBackgroundUrl);
          currentBackgroundUrl = null;
        }
        updateBackgroundCurrentText("None");
        applyBackgroundToCurrentPage();
      } catch (e) {
        alert("삭제 실패");
      }
    }

    function toggleMenu() {
      document.getElementById("sideMenu").classList.toggle("open");
    }

    function closeMenu() {
      document.getElementById("sideMenu").classList.remove("open");
    }

    function hideAllPages() {
      document.getElementById("onitPage").style.display = "none";
      document.getElementById("timerPage").style.display = "none";
      document.getElementById("recordsPage").style.display = "none";
      document.getElementById("timeLogPage").style.display = "none";
      document.getElementById("settingsPage").style.display = "none";
    }

    function showOnIt() {
      hideAllPages();
      document.getElementById("onitPage").style.display = "flex";
      document.getElementById("headerTitle").textContent = "On It";

      renderTagChips();
      updateOnItStatus();
      updateDisplay();
      applyBackgroundToCurrentPage();
      closeMenu();
    }

    function showTimer() {
      hideAllPages();
      document.getElementById("timerPage").style.display = "flex";
      document.getElementById("headerTitle").textContent = "Timer";

      if (timerState === "running" || timerState === "paused") {
        showTimerRunningScreen();
      } else {
        showTimerSetupScreen();
      }

      applyBackgroundToCurrentPage();
      closeMenu();
    }

    function showRecords() {
      hideAllPages();
      document.getElementById("recordsPage").style.display = "block";
      document.getElementById("headerTitle").textContent = "Records";
      renderRecords();
      closeMenu();
    }

    function showTimeLog() {
      hideAllPages();
      document.getElementById("timeLogPage").style.display = "block";
      document.getElementById("headerTitle").textContent = "Time Log";
      renderTimeLog();
      closeMenu();
    }

    function showSettings() {
      hideAllPages();
      document.getElementById("settingsPage").style.display = "block";
      document.getElementById("headerTitle").textContent = "Settings";
      renderTagManagerUI();
      renderSettings();
      closeMenu();
    }

    let onItState = "idle";
    let sessionSeconds = 0;
    let onItStartTime = null;

    function getTodayTotalSeconds() {
      const records = JSON.parse(localStorage.getItem("onItRecords")) || [];
      const today = getToday();
      return records
        .filter(r => r.date === today)
        .reduce((sum, r) => sum + (Number(r.seconds) || 0), 0);
    }

    function getCurrentOnItElapsed() {
      if (onItState === "running" && onItStartTime !== null) {
        const diff = Math.floor((Date.now() - onItStartTime) / 1000);
        return sessionSeconds + diff;
      }
      return sessionSeconds;
    }

    function updateOnItStatus() {
      const playBtn = document.getElementById("onitPlayBtn");
      const pauseBtn = document.getElementById("onitPauseBtn");
      const tagWrapper = document.getElementById("onitTagWrapper");

      if (playBtn) playBtn.classList.remove("active-glow-play");
      if (pauseBtn) pauseBtn.classList.remove("active-glow-pause");

      if (onItState === "running") {
        if (playBtn) playBtn.classList.add("active-glow-play");
        if (tagWrapper) tagWrapper.style.display = "none";
      } else if (onItState === "paused" || sessionSeconds > 0) {
        if (pauseBtn) pauseBtn.classList.add("active-glow-pause");
        if (tagWrapper) tagWrapper.style.display = "none";
      } else {
        if (tagWrapper) tagWrapper.style.display = "flex";
      }
    }

    function updateDisplay() {
      const currentSession = getCurrentOnItElapsed();
      document.getElementById("sessionTime").textContent = formatOnIt(currentSession);

      let todayTotal = getTodayTotalSeconds();
      if (onItState === "running") {
        todayTotal += (currentSession - sessionSeconds);
      }

      document.getElementById("totalTime").textContent = formatTodayHours(todayTotal);
    }

    function startSession() {
      if (timerState === "running" || timerState === "paused") {
        if (!confirm("타이머가 작동 중입니다. On It을 시작할까요?")) return;
        stopTimer();
      }

      if (onItState !== "running") {
        onItStartTime = Date.now();
        onItState = "running";
      }

      updateOnItStatus();
      updateDisplay();
    }

    function pauseSession() {
      if (onItState !== "running") return;
      sessionSeconds = getCurrentOnItElapsed();
      onItState = "paused";
      onItStartTime = null;

      updateOnItStatus();
      updateDisplay();
    }

    function stopSession() {
      if (onItState === "running") {
        sessionSeconds = getCurrentOnItElapsed();
      }

      if (sessionSeconds > 0) {
        saveRecord(sessionSeconds, getToday(), activeTag, "");
      }

      sessionSeconds = 0;
      onItState = "idle";
      onItStartTime = null;

      updateOnItStatus();
      updateDisplay();
    }

    let timerState = "idle";
    let timerPhases = [];
    let currentPhaseIndex = 0;
    let timerPhaseStartTime = null;
    let timerPhaseRemainingAtPause = 0;
    let timerTotalElapsed = 0;
    let timerLoop = null;

    const DEFAULT_PRESETS = [
      { id: "p1", name: "25 / 5 / 25 / 5", values: [25, 5, 25, 5] },
      { id: "p2", name: "50 / 10 / 50 / 10", values: [50, 10, 50, 10] },
      { id: "p3", name: "10 / 2 / 10 / 2", values: [10, 2, 10, 2] }
    ];

    function getCustomPresets() {
      return JSON.parse(localStorage.getItem("onItTimerPresets")) || DEFAULT_PRESETS;
    }

    function saveCustomPresets(presets) {
      localStorage.setItem("onItTimerPresets", JSON.stringify(presets));
    }

    function applyPreset(m1, m2, m3, m4) {
      const i1 = document.getElementById("tMin1");
      const i2 = document.getElementById("tMin2");
      const i3 = document.getElementById("tMin3");
      const i4 = document.getElementById("tMin4");
      if (i1 && i2 && i3 && i4) {
        i1.value = m1;
        i2.value = m2;
        i3.value = m3;
        i4.value = m4;
      }

    function addCurrentAsPreset() {
      const m1 = Math.max(0, parseInt(document.getElementById("tMin1").value) || 0);
      const m2 = Math.max(0, parseInt(document.getElementById("tMin2").value) || 0);
      const m3 = Math.max(0, parseInt(document.getElementById("tMin3").value) || 0);
      const m4 = Math.max(0, parseInt(document.getElementById("tMin4").value) || 0);

      if (m1 === 0 && m2 === 0 && m3 === 0 && m4 === 0) {
        alert("최소 하나의 분 시간을 입력하세요.");

      }

      const presets = getCustomPresets();

    function renderTimerTagChips() {
      const container = document.getElementById("timerTagChips");
      if (!container) return;

      container.innerHTML = tags.map(t => `
        <button class="tag-chip ${activeTag === t ? 'selected' : ''}" onclick="selectActiveTag('${t}'); renderTimerTagChips();">${t}</button>

    function showTimerSetupScreen() {
      const page = document.getElementById("timerPage");

      let presetButtonsHtml = presets.map(p => `

            <input type="number" id="tMin4" class="timer-input" value="5" min="0">
          </div>

        <div class="preset-container">
          <div class="preset-list">

    function showTimerRunningScreen() {
      const page = document.getElementById("timerPage");
      page.innerHTML = `
        <div class="timer-remaining background-readable" id="timerRemainingDisplay">00:00:00</div>
        <div class="timer-phase-info background-readable" id="timerPhaseInfo">1 / 4</div>
        <div class="controls">
          <button class="control-button" id="timerPlayBtn" onclick="resumeTimer()">▶</button>
          <button class="control-button" id="timerPauseBtn" onclick="pauseTimer()">Ⅱ</button>
          <button class="control-button" onclick="stopTimer()">■</button>
        </div>
      `;
      updateTimerRunningDisplay();
    }

    function updateTimerRunningDisplay() {
      const display = document.getElementById("timerRemainingDisplay");
      const phaseInfo = document.getElementById("timerPhaseInfo");
      const playBtn = document.getElementById("timerPlayBtn");
      const pauseBtn = document.getElementById("timerPauseBtn");

      if (!display || !phaseInfo) return;

      if (playBtn) playBtn.classList.remove("active-glow-play");
      if (pauseBtn) pauseBtn.classList.remove("active-glow-pause");

      if (timerState === "running") {
        if (playBtn) playBtn.classList.add("active-glow-play");
      } else if (timerState === "paused") {
        if (pauseBtn) pauseBtn.classList.add("active-glow-pause");
      }

      let currentPhaseSec = 0;
      if (timerState === "running" && timerPhaseStartTime !== null) {
        const elapsedSinceStart = Math.floor((Date.now() - timerPhaseStartTime) / 1000);
        currentPhaseSec = Math.max(0, timerPhaseRemainingAtPause - elapsedSinceStart);
      } else {
        currentPhaseSec = timerPhaseRemainingAtPause;
      }

      display.textContent = formatTimer(currentPhaseSec);
      phaseInfo.textContent = `${currentPhaseIndex + 1} / ${timerPhases.length}`;
    }

    function startTimerSetup() {
      if (onItState === "running" || onItState === "paused" || sessionSeconds > 0) {
        if (!confirm("On It이 작동 중입니다. 타이머를 시작할까요?")) return;
        stopSession();
      }

      const m1 = Math.max(0, parseInt(document.getElementById("tMin1").value) || 0);
      const m2 = Math.max(0, parseInt(document.getElementById("tMin2").value) || 0);
      const m3 = Math.max(0, parseInt(document.getElementById("tMin3").value) || 0);
      const m4 = Math.max(0, parseInt(document.getElementById("tMin4").value) || 0);

      const phasesInSec = [m1 * 60, m2 * 60, m3 * 60, m4 * 60].filter(sec => sec > 0);

      if (phasesInSec.length === 0) {
        alert("최소 하나의 구간에 분 시간을 입력해주세요.");
        return;
      }

      timerPhases = phasesInSec;
      currentPhaseIndex = 0;
      timerTotalElapsed = 0;
      timerPhaseRemainingAtPause = timerPhases[0];
      timerPhaseStartTime = Date.now();
      timerState = "running";

      showTimerRunningScreen();
      runTimerLoop();
    }

    function runTimerLoop() {
      if (timerLoop) clearInterval(timerLoop);

      timerLoop = setInterval(() => {
        if (timerState !== "running") return;

        const now = Date.now();
        const elapsedSinceStart = Math.floor((now - timerPhaseStartTime) / 1000);
        const currentPhaseSec = timerPhaseRemainingAtPause - elapsedSinceStart;

        updateTimerRunningDisplay();
        updateDisplay();

        if (currentPhaseSec <= 0) {
          triggerTimerAlert();
          timerTotalElapsed += timerPhases[currentPhaseIndex];
          currentPhaseIndex++;

          if (currentPhaseIndex < timerPhases.length) {
            timerPhaseRemainingAtPause = timerPhases[currentPhaseIndex];
            timerPhaseStartTime = Date.now();
          } else {
            finishTimer();
          }
        }
      }, 500);
    }

    function pauseTimer() {
      if (timerState !== "running") return;
      
      const elapsedSinceStart = Math.floor((Date.now() - timerPhaseStartTime) / 1000);
      timerPhaseRemainingAtPause = Math.max(0, timerPhaseRemainingAtPause - elapsedSinceStart);
      timerState = "paused";

      updateTimerRunningDisplay();
    }

    function resumeTimer() {
      if (timerState === "paused") {
        timerState = "running";
        timerPhaseStartTime = Date.now();

        updateTimerRunningDisplay();
      }
    }

    function stopTimer() {
      if (timerLoop) clearInterval(timerLoop);

      let actualElapsed = timerTotalElapsed;
      if (timerState === "running") {
        const elapsedSinceStart = Math.floor((Date.now() - timerPhaseStartTime) / 1000);
        const currentRemaining = Math.max(0, timerPhaseRemainingAtPause - elapsedSinceStart);
        actualElapsed += (timerPhases[currentPhaseIndex] - currentRemaining);
      } else if (timerState === "paused") {
        actualElapsed += (timerPhases[currentPhaseIndex] - timerPhaseRemainingAtPause);
      }

      if (actualElapsed > 0) {
        saveRecord(actualElapsed, getToday(), activeTag, "");
      }

      timerState = "idle";
      timerPhaseStartTime = null;

      showTimerSetupScreen();
      updateDisplay();
    }

    function finishTimer() {
      if (timerLoop) clearInterval(timerLoop);

      saveRecord(timerTotalElapsed, getToday(), activeTag, "");

      timerState = "idle";
      timerPhaseStartTime = null;

      updateDisplay();
    }

    let alertMode = localStorage.getItem("onItAlertMode") || "flash";

    function setAlertMode(mode) {
      alertMode = mode;
      localStorage.setItem("onItAlertMode", alertMode);
      renderSettings();
      if (mode === "sound") playAlertSound();

    function renderSettings() {
      const flashBtn = document.getElementById("flashAlertButton");
      const soundBtn = document.getElementById("soundAlertButton");
      const currentText = document.getElementById("currentAlertText");

      if (!flashBtn || !soundBtn) return;

      flashBtn.classList.remove("selected");
      soundBtn.classList.remove("selected");

      if (alertMode === "sound") {
        soundBtn.classList.add("selected");
        currentText.textContent = "Current: Sound";
      } else {
        flashBtn.classList.add("selected");
        currentText.textContent = "Current: Screen flashing";
      }
    }

    function playAlertSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        function playBeep(freq, startTime, duration) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, startTime);
          
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.3, startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        }

        const now = ctx.currentTime;
        playBeep(1046, now, 0.15);
        playBeep(1318, now + 0.18, 0.25);
        playBeep(1046, now + 0.5, 0.15);
        playBeep(1318, now + 0.68, 0.25);

        setTimeout(() => ctx.close(), 1500);
      } catch (e) {}
    }

    function flashScreen() {
      const display = document.getElementById("timerRemainingDisplay");
      if (!display) return;

      let count = 0;
      const interval = setInterval(() => {
        display.classList.toggle("text-flash");
        count++;
        if (count >= 6) {
          clearInterval(interval);
          display.classList.remove("text-flash");
        }
      }, 200);
    }

    function triggerTimerAlert() {
      if (alertMode === "sound") playAlertSound();
      else flashScreen();
    }

    function parseDateStr(dateStr) {
      const parts = dateStr.split(".");
      return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    }

    function getRangeTotals() {
      const records = JSON.parse(localStorage.getItem("onItRecords")) || [];
      const now = new Date();
      const todayStr = getToday();

      const currentDay = now.getDay();
      const diffToMon = now.getDate() - currentDay + (currentDay === 0 ? -6 : 1);
      const monday = new Date(now.setDate(diffToMon));
      monday.setHours(0, 0, 0, 0);

      const currentYear = new Date().getFullYear();
      const currentMonth = new Date().getMonth();

      let todaySec = 0;
      let weekSec = 0;
      let monthSec = 0;

      records.forEach(r => {
        const sec = Number(r.seconds) || 0;
        const rDate = parseDateStr(r.date);

        if (r.date === todayStr) todaySec += sec;
        if (rDate >= monday) weekSec += sec;
        if (rDate.getFullYear() === currentYear && rDate.getMonth() === currentMonth) {
          monthSec += sec;
        }
      });

      return { todaySec, weekSec, monthSec };
    }

    function saveRecord(seconds, date, type = "On It", memo = "") {
      seconds = Math.max(0, Math.floor(Number(seconds) || 0));
      if (seconds <= 0) return;

      const records = JSON.parse(localStorage.getItem("onItRecords")) || [];
      records.push({
        id: Date.now() + Math.floor(Math.random() * 1000),
        date: date || getToday(),
        seconds: seconds,
        type: type,
        memo: memo || ""
      });

      localStorage.setItem("onItRecords", JSON.stringify(records));
    }

    function renderRatioStats(records) {
      const container = document.getElementById("ratioStatsList");
      if (!container) return;

      if (records.length === 0) {
        container.innerHTML = `<div style="color:#777; font-size:13px; text-align:center;">데이터가 없습니다.</div>`;
        return;
      }

      const activeTags = getCustomTags();
      const tagTotals = {};
      let totalAllSec = 0;

      records.forEach(r => {
        const t = r.type || "On It";
        if (activeTags.includes(t)) {
          const sec = Number(r.seconds) || 0;
          tagTotals[t] = (tagTotals[t] || 0) + sec;
          totalAllSec += sec;
        }
      });

      if (totalAllSec === 0) {
        container.innerHTML = `<div style="color:#777; font-size:13px; text-align:center;">데이터가 없습니다.</div>`;
        return;
      }

      const sortedTags = Object.keys(tagTotals).sort((a, b) => tagTotals[b] - tagTotals[a]);

      container.innerHTML = sortedTags.map(tag => {
        const sec = tagTotals[tag];
        const percent = ((sec / totalAllSec) * 100).toFixed(1);
        return `
          <div class="ratio-item">
            <div class="ratio-info-row">
              <span>${tag}</span>
              <span>${formatRecordText(sec)} (${percent}%)</span>
            </div>
            <div class="ratio-bar-bg">
              <div class="ratio-bar-fill" style="width: ${percent}%;"></div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderRecords() {
      const listContainer = document.getElementById("recordsList");
      const todayEl = document.getElementById("todayTotalValue");
      const weekEl = document.getElementById("weekTotalValue");
      const monthEl = document.getElementById("monthTotalValue");
      const filterSelect = document.getElementById("recordTagFilter");
      const monthOnlyCheckbox = document.getElementById("currentMonthOnlyCheckbox");

      const records = JSON.parse(localStorage.getItem("onItRecords")) || [];
      const activeTags = getCustomTags();
      
      if (filterSelect) {
        const currentFilterVal = filterSelect.value;
        filterSelect.innerHTML = `<option value="ALL">모든 태그 (전체 보기)</option>` +
          activeTags.map(t => `<option value="${t}" ${currentFilterVal === t ? 'selected' : ''}>${t}</option>`).join("");
      }

      const selectedFilter = filterSelect ? filterSelect.value : "ALL";
      
      let filteredRecords = selectedFilter === "ALL" 
        ? records.filter(r => activeTags.includes(r.type || "On It")) 
        : records.filter(r => r.type === selectedFilter);

      if (monthOnlyCheckbox && monthOnlyCheckbox.checked) {
        const now = new Date();
        const curY = now.getFullYear();
        const curM = now.getMonth();
        filteredRecords = filteredRecords.filter(r => {
          const d = parseDateStr(r.date);
          return d.getFullYear() === curY && d.getMonth() === curM;
        });
      }

      const { todaySec, weekSec, monthSec } = getRangeTotals();
      if (todayEl) todayEl.textContent = formatRecordText(todaySec);
      if (weekEl) weekEl.textContent = formatRecordText(weekSec);
      if (monthEl) monthEl.textContent = formatRecordText(monthSec);

      renderRatioStats(records);

      if (!listContainer) return;

      if (filteredRecords.length === 0) {
        listContainer.innerHTML = `<div class="empty-records">기록이 없습니다.</div>`;
        return;
      }

      const grouped = {};
      filteredRecords.forEach(r => {
        if (!grouped[r.date]) grouped[r.date] = [];
        grouped[r.date].push(r);
      });

      const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));
      let html = "";

      sortedDates.forEach(date => {
        const dayTotalSec = grouped[date].reduce((sum, item) => sum + (Number(item.seconds) || 0), 0);
        const dayTotalString = formatDayTotalText(dayTotalSec);

        html += `
          <div class="record-date-container">
            <div class="record-date">${date}</div>
            <div class="record-date-total">${dayTotalString}</div>
          </div>
        `;

        grouped[date].forEach(item => {
          const displayText = formatRecordText(item.seconds);
          const memoHtml = item.memo ? `<div class="record-memo">💬 ${item.memo}</div>` : '';
          html += `
            <div class="record-item">
              <div class="record-main-info">
                <div class="record-row-top">
                  <span class="record-time">${displayText}</span>
                  <span class="record-type">${item.type}</span>
                </div>
                ${memoHtml}
              </div>
              <div class="record-actions">
                <button onclick="editRecord(${item.id})" title="수정">✎</button>
                <button onclick="deleteRecord(${item.id})" title="삭제">✕</button>
              </div>
            </div>
          `;
        });
      });

      listContainer.innerHTML = html;
    }

    function editRecord(id) {
      let records = JSON.parse(localStorage.getItem("onItRecords")) || [];
      const item = records.find(r => r.id === id);
      if (!item) return;

      const currentMinutes = Math.round(item.seconds / 60);
      const timeInput = prompt("수정할 시간(분 단위 숫자)을 입력하세요:", currentMinutes);
      if (timeInput === null) return;

      const parsedMinutes = parseInt(timeInput.trim(), 10);
      if (isNaN(parsedMinutes) || parsedMinutes < 0) {
        alert("올바른 분(숫자)을 입력해주세요.");
        return;
      }

      const activeTags = getCustomTags();
      const tagInput = prompt(
        `수정할 태그 이름을 입력하세요.\n(현재 태그: ${item.type})\n[사용 가능 태그: ${activeTags.join(", ")}]`, 
        item.type
      );
      if (tagInput === null) return;

      const trimmedTag = tagInput.trim();
      if (!trimmedTag) {
        alert("태그는 비워둘 수 없습니다.");
        return;
      }

      const memoInput = prompt(
        `한 줄 메모를 입력하세요 \n비워두려면 내용을 지우세요:`,
        item.memo || ""
      );
      if (memoInput === null) return;

      item.seconds = parsedMinutes * 60;
      item.type = trimmedTag;
      item.memo = memoInput.trim();
      localStorage.setItem("onItRecords", JSON.stringify(records));

      renderRecords();
      updateDisplay();
    }

    function deleteRecord(id) {
      if (!confirm("기록을 삭제할까요?")) return;

    function exportRecordsCSV() {
      const records = JSON.parse(localStorage.getItem("onItRecords")) || [];
      if (records.length === 0) {
        alert("내보낼 기록이 없습니다.");
        return;
      }

      let csv = "\uFEFFDate,Type,Duration,Seconds,Memo\n";
      records.forEach(r => {
        const safeMemo = (r.memo || "").replace(/,/g, " ");
        csv += `${r.date},${r.type},${formatRecordText(r.seconds)},${r.seconds},${safeMemo}\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `OnIt_Records_${getToday()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function triggerImportCSV() {
      document.getElementById("csvFileInput").click();
    }

    function importRecordsCSV(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        const lines = text.split("\n");
        const existingRecords = JSON.parse(localStorage.getItem("onItRecords")) || [];
        let importedCount = 0;

        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;

          const parts = line.split(",");
          if (parts.length >= 4) {
            const date = parts[0].trim();
            const type = parts[1].trim();
            const seconds = parseInt(parts[3].trim(), 10);
            const memo = parts[4] ? parts[4].trim() : "";

            if (date && !isNaN(seconds) && seconds > 0) {
              existingRecords.push({
                id: Date.now() + i + Math.floor(Math.random() * 1000),
                date: date,
                type: type || "On It",
                seconds: seconds,
                memo: memo
              });
              importedCount++;
            }
          }
        }

        if (importedCount > 0) {
          localStorage.setItem("onItRecords", JSON.stringify(existingRecords));
          renderRecords();
          updateDisplay();
          alert(`${importedCount}개의 기록을 성공적으로 불러왔습니다.`);
        } else {
          alert("유효한 CSV 데이터 형식이 아닙니다.");
        }
        input.value = "";
      };
      reader.readAsText(file);
    }



    // ===== Time Log =====
    const TIMELOG_KEY = "onItTimeLogRecords";
    const TIMELOG_START_MIN = 7 * 60;
    const TIMELOG_END_MIN = 24 * 60;
    const TIMELOG_STEP = 10;
    const TIMELOG_SLOTS = (TIMELOG_END_MIN - TIMELOG_START_MIN) / TIMELOG_STEP;
    let timelogSelectedDate = new Date();
    timelogSelectedDate.setHours(0, 0, 0, 0);
    let timelogTool = "O";
    let timelogPainting = false;

    function timelogDateKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function timelogTodayKey() {
      const d = new Date();
      d.setHours(0,0,0,0);
      return timelogDateKey(d);
    }

    function loadTimeLogData() {
      try { return JSON.parse(localStorage.getItem(TIMELOG_KEY)) || {}; }
      catch (_) { return {}; }
    }

    function saveTimeLogData(data) {
      localStorage.setItem(TIMELOG_KEY, JSON.stringify(data));
    }

    function ensureTimeLogDay(data, key) {
      if (!Array.isArray(data[key]) || data[key].length !== TIMELOG_SLOTS) {
        data[key] = Array(TIMELOG_SLOTS).fill("");
      }
      return data[key];
    }

    function formatTimeLogDisplayDate(d) {
      const days = ["일","월","화","수","목","금","토"];
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const day = String(d.getDate()).padStart(2,"0");
      return `${y}. ${m}. ${day} (${days[d.getDay()]})`;
    }

    function setTimeLogTool(tool) {
      timelogTool = tool;
      ["O","I","X","Erase"].forEach(k => {
        const el = document.getElementById("timelogTool" + k);
        if (el) el.classList.remove("active");
      });
      const id = tool === "" ? "timelogToolErase" : "timelogTool" + tool;
      const el = document.getElementById(id);
      if (el) el.classList.add("active");
    }

    function changeTimeLogDate(delta) {
      const next = new Date(timelogSelectedDate);
      next.setDate(next.getDate() + delta);
      const today = new Date(); today.setHours(0,0,0,0);
      if (next > today) return;
      timelogSelectedDate = next;
      renderTimeLog();
    }

    function goTimeLogToday() {
      timelogSelectedDate = new Date();
      timelogSelectedDate.setHours(0,0,0,0);
      renderTimeLog();
    }

    function timeLogSlotLabel(index) {
      const mins = TIMELOG_START_MIN + index * TIMELOG_STEP;
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
    }

    function paintTimeLogCell(index) {
      const today = new Date(); today.setHours(0,0,0,0);
      if (timelogSelectedDate > today) return;
      const data = loadTimeLogData();
      const key = timelogDateKey(timelogSelectedDate);
      const arr = ensureTimeLogDay(data, key);
      arr[index] = timelogTool;
      saveTimeLogData(data);
      const cell = document.querySelector(`.timelog-cell[data-index="${index}"]`);
      if (cell) {
        cell.classList.remove("o","i","x");
        if (timelogTool) cell.classList.add(timelogTool.toLowerCase());
      }
      renderTimeLogStats();
    }

    function renderTimeLogGrid() {
      const grid = document.getElementById("timelogGrid");
      if (!grid) return;
      const data = loadTimeLogData();
      const key = timelogDateKey(timelogSelectedDate);
      const arr = ensureTimeLogDay(data, key);
      let html = '<div class="timelog-minutes-head"><div></div>' + [10,20,30,40,50,60].map(m => `<div>${m}</div>`).join('') + '<div></div></div>';
      for (let h = 7; h <= 23; h++) {
        html += `<div class="timelog-row"><div class="timelog-hour">${String(h).padStart(2,"0")}</div>`;
        for (let m = 0; m < 60; m += 10) {
          const index = ((h * 60 + m) - TIMELOG_START_MIN) / TIMELOG_STEP;
          const v = arr[index] || "";
          html += `<div class="timelog-cell ${v ? v.toLowerCase() : ''}" data-index="${index}" title="${timeLogSlotLabel(index)}"></div>`;
        }
        html += `<div class="timelog-hour timelog-hour-right">${String(h).padStart(2,"0")}</div></div>`;
      }
      grid.innerHTML = html;

      grid.querySelectorAll('.timelog-cell').forEach(cell => {
        const idx = Number(cell.dataset.index);
        cell.addEventListener('pointerdown', e => {
          e.preventDefault();
          timelogPainting = true;
          try { cell.setPointerCapture(e.pointerId); } catch (_) {}
          paintTimeLogCell(idx);
        });
        cell.addEventListener('pointerenter', e => {
          if (timelogPainting && (e.buttons || e.pointerType === 'touch')) paintTimeLogCell(idx);
        });
        cell.addEventListener('pointermove', e => {
          if (!timelogPainting) return;
          const target = document.elementFromPoint(e.clientX, e.clientY);
          if (target && target.classList && target.classList.contains('timelog-cell')) {
            paintTimeLogCell(Number(target.dataset.index));
          }
        });
      });
    }

    document.addEventListener('pointerup', () => { timelogPainting = false; });
    document.addEventListener('pointercancel', () => { timelogPainting = false; });

    function getTimeLogRangeTotals(startDate, endDate) {
      const data = loadTimeLogData();
      const totals = { O: 0, I: 0, X: 0 };
      const d = new Date(startDate); d.setHours(0,0,0,0);
      const end = new Date(endDate); end.setHours(0,0,0,0);
      while (d <= end) {
        const arr = data[timelogDateKey(d)] || [];
        arr.forEach(v => { if (totals[v] !== undefined) totals[v] += TIMELOG_STEP; });
        d.setDate(d.getDate() + 1);
      }
      return totals;
    }

    function timelogHours(mins) { return (mins / 60).toFixed(1) + "시간"; }

    function timelogStatsHtml(t) {
      return `<span class="timelog-stat-o">O ${timelogHours(t.O)}</span><span class="timelog-stat-i">I ${timelogHours(t.I)}</span><span class="timelog-stat-x">X ${timelogHours(t.X)}</span>`;
    }

    function renderTimeLogStats() {
      const d = new Date(timelogSelectedDate);
      const dayTotals = getTimeLogRangeTotals(d, d);
      const dow = d.getDay();
      const diff = dow === 0 ? -6 : 1 - dow;
      const mon = new Date(d); mon.setDate(d.getDate() + diff);
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      const monthStart = new Date(d.getFullYear(), d.getMonth(), 1);
      const monthEnd = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      document.getElementById('timelogDayStatLabel').textContent = `${d.getMonth()+1}/${d.getDate()}`;
      document.getElementById('timelogDayStats').innerHTML = timelogStatsHtml(dayTotals);
      document.getElementById('timelogWeekStats').innerHTML = timelogStatsHtml(getTimeLogRangeTotals(mon, sun));
      document.getElementById('timelogMonthStats').innerHTML = timelogStatsHtml(getTimeLogRangeTotals(monthStart, monthEnd));
    }

    function renderTimeLog() {
      const label = document.getElementById('timelogDateLabel');
      if (!label) return;
      label.textContent = formatTimeLogDisplayDate(timelogSelectedDate);
      const today = new Date(); today.setHours(0,0,0,0);
      const nextBtn = document.getElementById('timelogNextBtn');
      if (nextBtn) nextBtn.disabled = timelogSelectedDate >= today;
      renderTimeLogGrid();
      renderTimeLogStats();
    }

    function timeLogDownload(filename, csv) {
      const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportTimeLogCSVs() {
      const data = loadTimeLogData();
      const keys = Object.keys(data).filter(k => Array.isArray(data[k])).sort();
      if (keys.length === 0) { alert('내보낼 타임로그 기록이 없습니다.'); return; }
      const header = ['Date', ...Array.from({length: TIMELOG_SLOTS}, (_,i) => timeLogSlotLabel(i))];
      let detailed = header.join(',') + '\n';
      keys.forEach(k => { detailed += [k, ...ensureTimeLogDay(data, k)].join(',') + '\n'; });

      const first = new Date(keys[0] + 'T00:00:00');
      const today = new Date(); today.setHours(0,0,0,0);
      const last = new Date(Math.max(new Date(keys[keys.length-1] + 'T00:00:00').getTime(), today.getTime()));
      let monthly = 'Month,O Total Hours,I Total Hours,X Total Hours,O Daily Avg,I Daily Avg,O+I Daily Avg,X Daily Avg,O Max Day,I Max Day,X Max Day,O 3h Goal Days,I 2h Goal Days\n';
      let cursor = new Date(first.getFullYear(), first.getMonth(), 1);
      while (cursor <= last) {
        const y = cursor.getFullYear(), m = cursor.getMonth();
        const monthStart = new Date(y, m, 1);
        const calendarEnd = new Date(y, m+1, 0);
        let effectiveEnd = calendarEnd;
        if (y === today.getFullYear() && m === today.getMonth()) effectiveEnd = today;
        if (monthStart > today) break;
        const divisor = effectiveEnd.getDate();
        let totals = {O:0,I:0,X:0}, max = {O:0,I:0,X:0}, oGoal=0, iGoal=0;
        const d = new Date(monthStart);
        while (d <= effectiveEnd) {
          const dayT = getTimeLogRangeTotals(d, d);
          ['O','I','X'].forEach(k => { totals[k]+=dayT[k]; max[k]=Math.max(max[k],dayT[k]); });
          if (dayT.O >= 180) oGoal++;
          if (dayT.I >= 120) iGoal++;
          d.setDate(d.getDate()+1);
        }
        const monthKey = `${y}-${String(m+1).padStart(2,'0')}`;
        const h = v => (v/60).toFixed(1);
        monthly += [monthKey,h(totals.O),h(totals.I),h(totals.X),h(totals.O/divisor),h(totals.I/divisor),h((totals.O+totals.I)/divisor),h(totals.X/divisor),h(max.O),h(max.I),h(max.X),oGoal,iGoal].join(',') + '\n';
        cursor = new Date(y, m+1, 1);
      }
      const stamp = timelogTodayKey();
      timeLogDownload(`ONIT_Timelog_${stamp}.csv`, detailed);
      setTimeout(() => timeLogDownload(`ONIT_Timelog_Monthly_${stamp}.csv`, monthly), 250);
    }

    function triggerTimeLogImport() { document.getElementById('timelogCsvInput').click(); }

    function importTimeLogCSV(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const text = String(e.target.result || '').replace(/^\uFEFF/, '');
        const lines = text.split(/\r?\n/).filter(Boolean);
        if (lines.length < 2) { alert('유효한 타임로그 CSV가 아닙니다.'); input.value=''; return; }
        const header = lines[0].split(',').map(v => v.trim());
        if (header[0] !== 'Date' || header.length !== TIMELOG_SLOTS + 1 || header[1] !== '07:00' || header[header.length-1] !== '23:50') {
          alert('타임로그 상세 CSV 형식이 아닙니다.'); input.value=''; return;
        }
        const data = loadTimeLogData();
        let count = 0;
        for (let i=1;i<lines.length;i++) {
          const parts = lines[i].split(',');
          if (parts.length < TIMELOG_SLOTS + 1) continue;
          const date = parts[0].trim();
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
          const arr = parts.slice(1, TIMELOG_SLOTS+1).map(v => { const x=v.trim().toUpperCase(); return ['O','I','X'].includes(x) ? x : ''; });
          data[date] = arr;
          count++;
        }
        if (!count) { alert('불러올 수 있는 기록이 없습니다.'); input.value=''; return; }
        saveTimeLogData(data);
        renderTimeLog();
        alert(`${count}일의 타임로그를 불러왔습니다. 동일 날짜는 가져온 기록으로 덮어썼습니다.`);
        input.value='';
      };
      reader.readAsText(file);
    }

    function clearAllTimeLogRecords() {
      const data = loadTimeLogData();
      if (Object.keys(data).length === 0) { alert('삭제할 타임로그 기록이 없습니다.'); return; }
      if (!confirm('타임로그 기록을 모두 삭제할까요?\n이 작업은 되돌릴 수 없습니다.')) return;
      localStorage.removeItem(TIMELOG_KEY);
      renderTimeLog();
      alert('타임로그 기록이 모두 삭제되었습니다.');
    }


    window.addEventListener("DOMContentLoaded", () => {
      initPWA();
      loadBackgroundImage();
      renderTagChips();
      updateDisplay();
      setInterval(updateDisplay, 500);
    });
  </script>
