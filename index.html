<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On It</title>
  
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="On It">

  <link rel="manifest" id="manifestLink">

  <style>
    :root {
      --font-main: "Trebuchet MS", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: #fff;
      font-family: var(--font-main);
    }

    body {
      min-height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .onit-page,
    .timer-page {
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .onit-page > *,
    .timer-page > * {
      position: relative;
      z-index: 1;
    }

    .background-readable {
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000,
         0   -1px 0 #000,
         0    1px 0 #000,
        -1px  0   0 #000,
         1px  0   0 #000;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      display: flex;
      align-items: center;
      padding: 18px 24px;
      background: transparent;
      border: none;
      z-index: 900;
      pointer-events: none;
    }

    .menu-button {
      background: none;
      border: none;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      padding: 0;
      margin: 0;
      pointer-events: auto;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    }

    .header-title { display: none; }

    .side-menu {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background: #181818;
      padding: 60px 20px 20px;
      transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      border-right: 1px solid #2a2a2a;
    }

    .side-menu.open { left: 0; }

    .menu-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #888;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .menu-close-btn:hover { color: #fff; }

    .side-menu button.menu-item {
      width: 100%;
      padding: 16px 12px;
      margin-bottom: 8px;
      background: none;
      border: none;
      color: #fff;
      text-align: left;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
    }

    .side-menu button.menu-item:hover { background: #252525; }

    .tag-selector-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 360px;
      transition: opacity 0.2s ease;
    }

    .tag-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .tag-chip {
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      color: #bbb;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag-chip:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .tag-chip.selected {
      background: rgba(255, 255, 255, 0.3);
      border-color: #fff;
      color: #fff;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .control-button {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: linear-gradient(145deg, #232323, #161616);
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .control-button:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.3);
      background: linear-gradient(145deg, #2d2d2d, #1a1a1a);
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
    }

    .control-button:active {
      transform: translateY(1px);
      box-shadow: 0 3px 8px rgba(0,0,0,0.5);
    }

    .control-button.active-play {
      border-color: rgba(255, 255, 255, 0.6);
      background: linear-gradient(145deg, #3a3a3a, #222222);
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.35);
      color: #fff;
    }

    .session-time {
      font-size: 72px;
      font-weight: 300;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .status {
      font-size: 24px;
      height: 40px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ccc;
    }

    .total-label {
      font-size: 16px;
      color: #fff;
      margin-bottom: 6px;
    }

    .total-time {
      font-size: 32px;
      font-weight: 300;
      margin-bottom: 20px;
    }

    .timer-inputs-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .timer-inputs {
      display: flex;
      gap: 16px;
    }

    .timer-input {
      width: 80px;
      height: 70px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 14px;
      color: #fff;
      font-size: 28px;
      font-weight: 300;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    .timer-input:focus { border-color: #666; }

    .preset-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 320px;
    }

    .preset-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .preset-btn {
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      color: #ddd;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preset-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .preset-del-btn {
      font-size: 11px;
      color: #888;
      cursor: pointer;
      margin-left: 2px;
    }

    .preset-del-btn:hover { color: #ff6b6b; }

    .preset-add-btn {
      padding: 5px 10px;
      background: none;
      border: 1px dashed #555;
      border-radius: 15px;
      color: #888;
      font-size: 12px;
      cursor: pointer;
    }

    .preset-add-btn:hover {
      border-color: #aaa;
      color: #fff;
    }

    .timer-status {
      font-size: 24px;
      height: 40px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ccc;
    }

    .timer-remaining {
      font-size: 72px;
      font-weight: 300;
      letter-spacing: 1px;
      margin-bottom: 5px;
      transition: opacity 0.15s;
    }

    .timer-phase-info {
      font-size: 22px;
      color: #aaa;
      margin-bottom: 25px;
      font-weight: 300;
    }

    .text-flash { opacity: 0.1 !important; }

    .records-page {
      min-height: 100vh;
      padding: 80px 24px 40px;
      max-width: 700px;
      margin: 0 auto;
    }

    .records-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .records-toolbar button {
      padding: 9px 13px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1c1c1c;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .records-toolbar button:hover { background: #252525; }

    .records-toolbar button.btn-reset {
      border-color: rgba(255, 85, 85, 0.3);
      color: #ff6b6b;
    }

    .records-toolbar button.btn-reset:hover {
      background: rgba(255, 85, 85, 0.15);
      border-color: #ff5555;
    }

    #csvFileInput { display: none; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .summary-card {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
    }

    .summary-card-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
    }

    .summary-card-value {
      font-size: 18px;
      font-weight: 300;
      color: #fff;
    }

    .ratio-stats-box {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .ratio-stats-box details summary {
      font-size: 15px;
      color: #aaa;
      cursor: pointer;
      outline: none;
      user-select: none;
    }

    .ratio-stats-box details summary:hover {
      color: #fff;
    }

    .ratio-stats-content {
      margin-top: 14px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .ratio-item {
      margin-bottom: 10px;
    }

    .ratio-item:last-child { margin-bottom: 0; }

    .ratio-info-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
      color: #ccc;
    }

    .ratio-bar-bg {
      width: 100%;
      height: 6px;
      background: #252525;
      border-radius: 3px;
      overflow: hidden;
    }

    .ratio-bar-fill {
      height: 100%;
      background: #888;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .tag-manage-box {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .tag-manage-title {
      font-size: 15px;
      color: #aaa;
      margin-bottom: 10px;
    }

    .tag-manage-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-manage-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: #252525;
      border: 1px solid #333;
      border-radius: 14px;
      font-size: 13px;
      color: #fff;
    }

    .tag-manage-item span.del {
      color: #888;
      cursor: pointer;
      font-size: 11px;
    }
    .tag-manage-item span.del:hover { color: #ff6b6b; }

    .tag-add-input-group {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .tag-add-input-group input {
      flex: 1;
      padding: 6px 10px;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .tag-add-input-group button {
      padding: 6px 12px;
      background: #333;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .tag-add-input-group button:hover { background: #444; }

    .tag-filter-wrapper {
      margin-bottom: 15px;
    }

    .tag-filter-select {
      width: 100%;
      padding: 10px 12px;
      background: #181818;
      border: 1px solid #292929;
      color: #fff;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      max-height: 200px;
    }

    .records-list { margin-top: 10px; }

    .record-date {
      font-size: 18px;
      margin-top: 25px;
      margin-bottom: 10px;
      color: #888;
      border-bottom: 1px solid #222;
      padding-bottom: 5px;
    }

    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #1a1a1a;
      gap: 15px;
    }

    .record-time { font-size: 20px; }

    .record-type {
      color: #888;
      font-size: 13px;
      background: #222;
      padding: 2px 8px;
      border-radius: 6px;
      margin-left: 8px;
    }

    .record-actions {
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    .record-actions button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 18px;
      cursor: pointer;
    }

    .record-actions button:hover { color: #fff; }

    .empty-records {
      color: #666;
      font-size: 16px;
      margin-top: 40px;
      text-align: center;
    }

    .settings-page {
      min-height: 100vh;
      padding: 80px 24px 40px;
      max-width: 700px;
      margin: 0 auto;
    }

    .settings-section { margin-top: 35px; }
    .settings-section:first-child { margin-top: 10px; }

    .settings-title {
      font-size: 20px;
      margin-bottom: 18px;
    }

    .settings-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid #222;
      gap: 20px;
    }

    .settings-option-label { font-size: 18px; }

    .settings-option button {
      min-width: 120px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1c1c1c;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .settings-option button:hover { background: #252525; }

    .settings-option button.selected {
      border-color: #777;
      background: #2a2a2a;
    }

    .settings-current {
      color: #999;
      font-size: 14px;
      margin-top: 10px;
    }

    .background-settings {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid #222;
    }

    .background-preview-name {
      color: #999;
      font-size: 14px;
      margin: 10px 0 16px;
      word-break: break-all;
    }

    .background-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .background-buttons button {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1c1c1c;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .background-buttons button:hover { background: #252525; }

    #backgroundFileInput { display: none; }

    @media (max-width: 600px) {
      header { padding: 14px 18px; }
      .session-time { font-size: 56px; }
      .total-time { font-size: 28px; }
      .timer-remaining { font-size: 56px; }
      .timer-input { width: 68px; height: 60px; font-size: 24px; }
      .control-button { width: 62px; height: 62px; font-size: 20px; }
      .summary-card-value { font-size: 15px; }
    }
  </style>
</head>

<body>

  <header>
    <button class="menu-button" onclick="toggleMenu()">☰</button>
    <div class="header-title" id="headerTitle">On It</div>
  </header>

  <nav class="side-menu" id="sideMenu">
    <button class="menu-close-btn" onclick="closeMenu()">✕</button>
    <button class="menu-item" onclick="showOnIt()">On It</button>
    <button class="menu-item" onclick="showTimer()">Timer</button>
    <button class="menu-item" onclick="showRecords()">Records</button>
    <button class="menu-item" onclick="showSettings()">Settings</button>
  </nav>

  <main class="onit-page" id="onitPage">
    <div class="status background-readable" id="status">■</div>
    
    <div class="tag-selector-wrapper background-readable" id="onitTagWrapper">
      <div class="tag-chips" id="onitTagChips"></div>
    </div>

    <div class="session-time background-readable" id="sessionTime">0:00</div>
    <div class="total-label background-readable">Total</div>
    <div class="total-time background-readable" id="totalTime">0:00</div>

    <div class="controls">
      <button class="control-button" id="onitPlayBtn" onclick="startSession()">▶</button>
      <button class="control-button" onclick="pauseSession()">Ⅱ</button>
      <button class="control-button" onclick="stopSession()">■</button>
    </div>
  </main>

  <section class="timer-page" id="timerPage" style="display: none;"></section>

  <section class="records-page" id="recordsPage" style="display: none;">
    <div class="tag-manage-box">
      <div class="tag-manage-title">작업 태그 관리</div>
      <div class="tag-manage-list" id="tagManageList"></div>
      <div class="tag-add-input-group">
        <input type="text" id="newTagNameInput" placeholder="새 태그(작품명) 입력...">
        <button onclick="addNewTag()">추가</button>
      </div>
    </div>

    <div class="records-toolbar">
      <button onclick="triggerImportCSV()">CSV 불러오기</button>
      <button onclick="exportRecordsCSV()">CSV 내보내기</button>
      <button class="btn-reset" onclick="clearAllRecords()">모든 기록 초기화</button>
    </div>
    <input type="file" id="csvFileInput" accept=".csv" onchange="importRecordsCSV(this)">

    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-card-label">Today</div>
        <div class="summary-card-value" id="todayTotalValue">0분</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-label">This Week</div>
        <div class="summary-card-value" id="weekTotalValue">0분</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-label">This Month</div>
        <div class="summary-card-value" id="monthTotalValue">0분</div>
      </div>
    </div>

    <div class="ratio-stats-box">
      <details>
        <summary>태그별 누적 시간 및 비율 (클릭하여 펼치기)</summary>
        <div class="ratio-stats-content" id="ratioStatsList"></div>
      </details>
    </div>

    <div class="tag-filter-wrapper">
      <select id="recordTagFilter" class="tag-filter-select" onchange="renderRecords()">
        <option value="ALL">모든 태그 (전체 보기)</option>
      </select>
    </div>

    <div class="records-list" id="recordsList"></div>
  </section>

  <section class="settings-page" id="settingsPage" style="display: none;">
    <div class="settings-section">
      <div class="settings-title">Alert</div>

      <div class="settings-option">
        <div class="settings-option-label">Screen flashing</div>
        <button id="flashAlertButton" onclick="setAlertMode('flash')">Select</button>
      </div>

      <div class="settings-option">
        <div class="settings-option-label">Sound</div>
        <button id="soundAlertButton" onclick="setAlertMode('sound')">Select</button>
      </div>

      <div class="settings-current" id="currentAlertText">
        Current: Screen flashing
      </div>
    </div>

    <div class="settings-section background-settings">
      <div class="settings-title">Background</div>

      <div class="background-preview-name" id="backgroundCurrentText">None</div>

      <div class="background-buttons">
        <button onclick="selectBackgroundImage()">Choose image</button>
        <button onclick="removeBackgroundImage()">Remove</button>
      </div>

      <input id="backgroundFileInput" type="file" accept="image/*" onchange="handleBackgroundFile(this)">
    </div>
  </section>

  <script>
    function initPWA() {
      const manifestData = {
        name: "On It",
        short_name: "OnIt",
        start_url: "./",
        display: "standalone",
        background_color: "#111111",
        theme_color: "#111111",
        icons: [{
          src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='%23fff' font-size='50' font-family='sans-serif'>O</text></svg>",
          sizes: "192x192 512x512",
          type: "image/svg+xml"
        }]
      };

      const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: "application/json" });
      document.getElementById("manifestLink").href = URL.createObjectURL(manifestBlob);

      if ("serviceWorker" in navigator) {
        const swCode = `
          const CACHE_NAME = 'onit-v31-cache';
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => e.waitUntil(clients.claim()));
          self.addEventListener('fetch', e => {
            e.respondWith(
              fetch(e.request).catch(() => caches.match(e.request))
            );
          });
        `;
        const swBlob = new Blob([swCode], { type: "text/javascript" });
        const swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      }
    }

    const DEFAULT_TAGS = ["On It", "웹소설 집필", "AI 프롬프트", "스토리보드 기획", "영상 편집"];
    let activeTag = localStorage.getItem("onItActiveTag") || "On It";

    function getCustomTags() {
      return JSON.parse(localStorage.getItem("onItCustomTags")) || DEFAULT_TAGS;
    }

    function saveCustomTags(tags) {
      localStorage.setItem("onItCustomTags", JSON.stringify(tags));
    }

    function renderTagChips() {
      const container = document.getElementById("onitTagChips");
      if (!container) return;
      const tags = getCustomTags();

      container.innerHTML = tags.map(t => `
        <button class="tag-chip ${activeTag === t ? 'selected' : ''}" onclick="selectActiveTag('${t}')">${t}</button>

    function getToday() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}.${month}.${day}`;
    }

    function formatOnIt(seconds) {
      seconds = Math.max(0, Math.floor(Number(seconds) || 0));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      return `${hours}:${String(minutes).padStart(2, "0")}`;
    }

    function formatRecordText(seconds) {
      seconds = Math.max(0, Math.floor(Number(seconds) || 0));
      if (seconds === 0) return "0분";

      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;

      let result = "";
      if (hours > 0) result += `${hours}시간 `;
      if (minutes > 0 || hours > 0) {
        result += `${minutes}분`;
      } else if (secs > 0) {
        result += `0분 ${secs}초`;
      }
      return result.trim();
    }

    function formatTimer(seconds) {
      seconds = Math.max(0, Math.floor(Number(seconds) || 0));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;

      return (
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(secs).padStart(2, "0")
      );
    }

    const BACKGROUND_DB_NAME = "OnItBackgroundDB";
    const BACKGROUND_STORE_NAME = "background";
    const BACKGROUND_KEY = "current";
    let currentBackgroundUrl = null;

    function openBackgroundDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error("IndexedDB 지원 불가"));
          return;
        }
        const request = indexedDB.open(BACKGROUND_DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(BACKGROUND_STORE_NAME)) {
            db.createObjectStore(BACKGROUND_STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function updateBackgroundCurrentText(text) {
      const el = document.getElementById("backgroundCurrentText");
      if (el) el.textContent = text;
    }

    async function loadBackgroundImage() {
      try {
        const db = await openBackgroundDB();
        const tx = db.transaction(BACKGROUND_STORE_NAME, "readonly");
        const store = tx.objectStore(BACKGROUND_STORE_NAME);
        const request = store.get(BACKGROUND_KEY);

        request.onsuccess = () => {
          const file = request.result;
          db.close();

          if (currentBackgroundUrl) {
            URL.revokeObjectURL(currentBackgroundUrl);
            currentBackgroundUrl = null;
          }

          if (!file) {
            updateBackgroundCurrentText("None");
            applyBackgroundToCurrentPage();
            return;
          }

          currentBackgroundUrl = URL.createObjectURL(file);
          updateBackgroundCurrentText(file.name || "Selected image");
          applyBackgroundToCurrentPage();
        };
      } catch (err) {
        updateBackgroundCurrentText("None");
      }
    }

    function applyBackgroundToCurrentPage() {
      const bg = currentBackgroundUrl ? `url("${currentBackgroundUrl}")` : "none";
      const onitPage = document.getElementById("onitPage");
      const timerPage = document.getElementById("timerPage");
      if (onitPage) onitPage.style.backgroundImage = bg;
      if (timerPage) timerPage.style.backgroundImage = bg;

    async function handleBackgroundFile(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      try {
        const db = await openBackgroundDB();
        const tx = db.transaction(BACKGROUND_STORE_NAME, "readwrite");
        const store = tx.objectStore(BACKGROUND_STORE_NAME);
        await store.put(file, BACKGROUND_KEY);
        db.close();
        await loadBackgroundImage();
      } catch (e) {
        alert("배경 이미지 저장에 실패했습니다.");
      }
      input.value = "";
    }

    async function removeBackgroundImage() {
      if (!confirm("배경 이미지를 삭제하시겠습니까?")) return;
      try {
        const db = await openBackgroundDB();
        const tx = db.transaction(BACKGROUND_STORE_NAME, "readwrite");
        tx.objectStore(BACKGROUND_STORE_NAME).delete(BACKGROUND_KEY);
        db.close();

        if (currentBackgroundUrl) {
          URL.revokeObjectURL(currentBackgroundUrl);
          currentBackgroundUrl = null;
        }
        updateBackgroundCurrentText("None");
        applyBackgroundToCurrentPage();
      } catch (e) {
        alert("삭제 실패");
      }
    }

    let isRunning = false;
    let startTime = null;
    let sessionSeconds = 0;

    function getTodayTotalSeconds() {
      const records = JSON.parse(localStorage.getItem("onItRecords")) || [];
      const today = getToday();
      return records
        .filter(r => r.date === today)
        .reduce((sum, r) => sum + (Number(r.seconds) || 0), 0);
    }

    function getCurrentOnItElapsed() {
      if (!isRunning || startTime === null) return sessionSeconds;
      return Math.max(0, Math.floor((Date.now() - startTime) / 1000));
    }

    function updateOnItStatus() {
      const status = document.getElementById("status");
      const playBtn = document.getElementById("onitPlayBtn");
      const tagWrapper = document.getElementById("onitTagWrapper");

      if (isRunning) {
        status.textContent = "▶";
        if (playBtn) playBtn.classList.add("active-play");
        if (tagWrapper) tagWrapper.style.display = "none";
      } else if (sessionSeconds > 0) {
        status.textContent = "Ⅱ";
        if (playBtn) playBtn.classList.remove("active-play");
        if (tagWrapper) tagWrapper.style.display = "none";
      } else {
        status.textContent = "■";
        if (playBtn) playBtn.classList.remove("active-play");
        if (tagWrapper) tagWrapper.style.display = "flex";
      }
    }

    function updateDisplay() {
      const currentSession = getCurrentOnItElapsed();
      document.getElementById("sessionTime").textContent = formatOnIt(currentSession);

      let todayTotal = getTodayTotalSeconds();
      if (isRunning) {
        todayTotal += currentSession;
      }
      if (timerIsRunning && timerStartTime !== null) {
        const timerElapsed = Math.floor((Date.now() - timerStartTime) / 1000);
        todayTotal += timerElapsed;
      }

      document.getElementById("totalTime").textContent = formatOnIt(todayTotal);
    }

    function startSession() {
      if (timerIsRunning) {
        if (!confirm("타이머가 작동 중입니다. On It을 시작할까요?")) return;
        stopTimer();
      }

      if (!isRunning) {
        startTime = Date.now() - sessionSeconds * 1000;
        isRunning = true;
      }

      updateOnItStatus();
      updateDisplay();
    }

    function pauseSession() {
      if (!isRunning) return;
      sessionSeconds = getCurrentOnItElapsed();
      isRunning = false;
      startTime = null;

      updateOnItStatus();
      updateDisplay();
    }

    function stopSession() {
      if (isRunning) {
        sessionSeconds = getCurrentOnItElapsed();
      }

      if (sessionSeconds > 0) {
        saveRecord(sessionSeconds, getToday(), activeTag);
      }

      sessionSeconds = 0;
      isRunning = false;
      startTime = null;

      updateOnItStatus();
      updateDisplay();
    }

    let timerIsRunning = false;
    let timerState = "idle";
    let timerPhases = [];
    let currentPhaseIndex = 0;
    let timerStartTime = null;
    let timerPhaseStartTime = null;
    let timerTotalElapsed = 0;
    let timerLoop = null;

    const DEFAULT_PRESETS = [
      { id: "p1", name: "5 / 10 / 15", values: [5, 10, 15] },
      { id: "p2", name: "25 / 5 / 25", values: [25, 5, 25] },

    function showTimerRunningScreen() {
      const page = document.getElementById("timerPage");
      page.innerHTML = `
        <div class="timer-status background-readable" id="timerStatusText">▶</div>
        <div class="timer-remaining background-readable" id="timerRemainingDisplay">00:00:00</div>

        <div class="controls">
          <button class="control-button active-play" id="timerPlayBtn" onclick="resumeTimer()">▶</button>
          <button class="control-button" onclick="pauseTimer()">Ⅱ</button>
          <button class="control-button" onclick="stopTimer()">■</button>
        </div>
      `;

    function startTimerSetup() {
      const m1 = Math.max(0, parseInt(document.getElementById("tMin1").value) || 0);
      const m2 = Math.max(0, parseInt(document.getElementById("tMin2").value) || 0);
      const m3 = Math.max(0, parseInt(document.getElementById("tMin3").value) || 0);

      const phasesInSec = [m1 * 60, m2 * 60, m3 * 60].filter(sec => sec > 0);

      if (phasesInSec.length === 0) {
        alert("최소 하나의 구간에 분 시간을 입력해주세요.");
        return;
      }

      if (isRunning) {
        pauseSession();
      }

      timerPhases = phasesInSec;
      currentPhaseIndex = 0;
      timerTotalElapsed = 0;
      timerStartTime = Date.now();
      timerPhaseStartTime = Date.now();
      timerIsRunning = true;
      timerState = "running";

      showTimerRunningScreen();
      runTimerLoop();
    }

    function runTimerLoop() {
      if (timerLoop) clearInterval(timerLoop);

      timerLoop = setInterval(() => {
        if (!timerIsRunning) return;

        const now = Date.now();
        const currentPhaseSec = timerPhases[currentPhaseIndex];
        const phaseElapsed = Math.floor((now - timerPhaseStartTime) / 1000);
        const phaseRemaining = Math.max(0, currentPhaseSec - phaseElapsed);

        const display = document.getElementById("timerRemainingDisplay");
        if (display) display.textContent = formatTimer(phaseRemaining);

        const phaseInfo = document.getElementById("timerPhaseInfo");
        if (phaseInfo) {
          phaseInfo.textContent = `${currentPhaseIndex + 1} / ${timerPhases.length}`;
        }

        updateDisplay();

        if (phaseRemaining <= 0) {
          triggerTimerAlert();
          timerTotalElapsed += currentPhaseSec;
          currentPhaseIndex++;

          if (currentPhaseIndex < timerPhases.length) {
            timerPhaseStartTime = Date.now();
          } else {
            finishTimer();
          }
        }
      }, 500);
    }

    function pauseTimer() {
      if (!timerIsRunning) return;
      timerIsRunning = false;
      timerState = "paused";
      const statusText = document.getElementById("timerStatusText");
      if (statusText) statusText.textContent = "Ⅱ";

      const playBtn = document.getElementById("timerPlayBtn");
      if (playBtn) playBtn.classList.remove("active-play");
    }

    function resumeTimer() {
      if (timerState === "paused") {
        timerIsRunning = true;
        timerState = "running";
        const statusText = document.getElementById("timerStatusText");
        if (statusText) statusText.textContent = "▶";

        const playBtn = document.getElementById("timerPlayBtn");
        if (playBtn) playBtn.classList.add("active-play");
      }
    }

    function stopTimer() {
      if (timerLoop) clearInterval(timerLoop);

      let actualElapsed = timerTotalElapsed;
      if (timerIsRunning || timerState === "paused") {
        const phaseElapsed = Math.floor((Date.now() - timerPhaseStartTime) / 1000);
        actualElapsed += Math.min(phaseElapsed, timerPhases[currentPhaseIndex] || 0);
      }

      if (actualElapsed > 0) {
        saveRecord(actualElapsed, getToday(), activeTag);
      }

      timerIsRunning = false;
      timerState = "idle";
      timerStartTime = null;

      showTimerSetupScreen();
      updateDisplay();
    }

    function finishTimer() {
      if (timerLoop) clearInterval(timerLoop);

      saveRecord(timerTotalElapsed, getToday(), activeTag);

      timerIsRunning = false;
      timerState = "idle";
      timerStartTime = null;

      const statusText = document.getElementById("timerStatusText");
      if (statusText) statusText.textContent = "■";

      updateDisplay();
    }

    function playAlertSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        function playBeep(freq, startTime, duration) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, startTime);
          
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.3, startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        }

        const now = ctx.currentTime;
        playBeep(1046, now, 0.15);
        playBeep(1318, now + 0.18, 0.25);
        playBeep(1046, now + 0.5, 0.15);
        playBeep(1318, now + 0.68, 0.25);

        setTimeout(() => ctx.close(), 1500);
      } catch (e) {}
    }

    function flashScreen() {

      const interval = setInterval(() => {

        if (count >= 6) {
          clearInterval(interval);
          display.classList.remove("text-flash");
        }
      }, 200);
    }

    function triggerTimerAlert() {
      if (alertMode === "sound") playAlertSound();
      else flashScreen();
    }

    function parseDateStr(dateStr) {
      const parts = dateStr.split(".");
      return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    }

    function getRangeTotals() {
      const records = JSON.parse(localStorage.getItem("onItRecords")) || [];
      const now = new Date();
      const todayStr = getToday();

      const currentDay = now.getDay();
      const diffToMon = now.getDate() - currentDay + (currentDay === 0 ? -6 : 1);
      const monday = new Date(now.setDate(diffToMon));
      monday.setHours(0, 0, 0, 0);

      const currentYear = new Date().getFullYear();
      const currentMonth = new Date().getMonth();

      let todaySec = 0;
      let weekSec = 0;
      let monthSec = 0;

      records.forEach(r => {
        const sec = Number(r.seconds) || 0;
        const rDate = parseDateStr(r.date);

        if (r.date === todayStr) todaySec += sec;
        if (rDate >= monday) weekSec += sec;
        if (rDate.getFullYear() === currentYear && rDate.getMonth() === currentMonth) {
          monthSec += sec;
        }
      });

      return { todaySec, weekSec, monthSec };
    }

    function saveRecord(seconds, date, type = "On It") {
      seconds = Math.max(0, Math.floor(Number(seconds) || 0));
      if (seconds <= 0) return;

      const records = JSON.parse(localStorage.getItem("onItRecords")) || [];
      records.push({
        id: Date.now() + Math.floor(Math.random() * 1000),
        date: date || getToday(),
        seconds: seconds,
        type: type
      });

      localStorage.setItem("onItRecords", JSON.stringify(records));
    }

    function renderRatioStats(records) {
      const container = document.getElementById("ratioStatsList");
      if (!container) return;

      if (records.length === 0) {
        container.innerHTML = `<div style="color:#777; font-size:13px; text-align:center;">데이터가 없습니다.</div>`;
        return;
      }

      const activeTags = getCustomTags();
      const tagTotals = {};
      let totalAllSec = 0;

      records.forEach(r => {
        const t = r.type || "On It";
        // 현재 태그 매니저에 등록된 활성 태그 데이터만 통계에 반영
        if (activeTags.includes(t)) {
          const sec = Number(r.seconds) || 0;
          tagTotals[t] = (tagTotals[t] || 0) + sec;
          totalAllSec += sec;
        }
      });

      if (totalAllSec === 0) {
        container.innerHTML = `<div style="color:#777; font-size:13px; text-align:center;">데이터가 없습니다.</div>`;
        return;
      }

      const sortedTags = Object.keys(tagTotals).sort((a, b) => tagTotals[b] - tagTotals[a]);

      container.innerHTML = sortedTags.map(tag => {
        const sec = tagTotals[tag];
        const percent = ((sec / totalAllSec) * 100).toFixed(1);
        return `
          <div class="ratio-item">
            <div class="ratio-info-row">
              <span>${tag}</span>
              <span>${formatRecordText(sec)} (${percent}%)</span>
            </div>
            <div class="ratio-bar-bg">
              <div class="ratio-bar-fill" style="width: ${percent}%;"></div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderRecords() {
      const listContainer = document.getElementById("recordsList");
      const todayEl = document.getElementById("todayTotalValue");
      const weekEl = document.getElementById("weekTotalValue");
      const monthEl = document.getElementById("monthTotalValue");
      const filterSelect = document.getElementById("recordTagFilter");

      const records = JSON.parse(localStorage.getItem("onItRecords")) || [];
      const activeTags = getCustomTags();
      
      if (filterSelect) {
        const currentFilterVal = filterSelect.value;
        // 드롭다운 목록을 현재 활성 태그 매니저 목록으로만 제한
        filterSelect.innerHTML = `<option value="ALL">모든 태그 (전체 보기)</option>` +
          activeTags.map(t => `<option value="${t}" ${currentFilterVal === t ? 'selected' : ''}>${t}</option>`).join("");
      }

      const selectedFilter = filterSelect ? filterSelect.value : "ALL";
      const filteredRecords = selectedFilter === "ALL" 
        ? records.filter(r => activeTags.includes(r.type || "On It")) 
        : records.filter(r => r.type === selectedFilter);

      const { todaySec, weekSec, monthSec } = getRangeTotals();
      todayEl.textContent = formatRecordText(todaySec);
      weekEl.textContent = formatRecordText(weekSec);
      monthEl.textContent = formatRecordText(monthSec);

      renderRatioStats(records);

      if (filteredRecords.length === 0) {
        listContainer.innerHTML = `<div class="empty-records">기록이 없습니다.</div>`;
        return;
      }

      const grouped = {};
      filteredRecords.forEach(r => {
        if (!grouped[r.date]) grouped[r.date] = [];
        grouped[r.date].push(r);
      });

      const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));
      let html = "";

      sortedDates.forEach(date => {
        html += `<div class="record-date">${date}</div>`;
        grouped[date].forEach(item => {
          const displayText = formatRecordText(item.seconds);
          html += `
            <div class="record-item">
              <div>
                <span class="record-time">${displayText}</span>
                <span class="record-type">${item.type}</span>
              </div>
              <div class="record-actions">
                <button onclick="editRecord(${item.id})" title="수정">✎</button>
                <button onclick="deleteRecord(${item.id})" title="삭제">✕</button>
              </div>
            </div>
          `;
        });
      });

      listContainer.innerHTML = html;
    }

    function editRecord(id) {
      let records = JSON.parse(localStorage.getItem("onItRecords")) || [];
      const item = records.find(r => r.id === id);
      if (!item) return;

      const currentMinutes = Math.round(item.seconds / 60);
      const timeInput = prompt("수정할 시간(분 단위 숫자)을 입력하세요:", currentMinutes);
      if (timeInput === null) return;

      const parsedMinutes = parseInt(timeInput.trim(), 10);
      if (isNaN(parsedMinutes) || parsedMinutes < 0) {
        alert("올바른 분(숫자)을 입력해주세요.");
        return;
      }

      const activeTags = getCustomTags();
      const tagInput = prompt(
        `수정할 태그 이름을 입력하세요.\n(현재 태그: ${item.type})\n[사용 가능 태그: ${activeTags.join(", ")}]`, 
        item.type
      );
      if (tagInput === null) return;

      const trimmedTag = tagInput.trim();
      if (!trimmedTag) {
        alert("태그는 비워둘 수 없습니다.");
        return;
      }

      item.seconds = parsedMinutes * 60;
      item.type = trimmedTag;
      localStorage.setItem("onItRecords", JSON.stringify(records));

      renderRecords();
      updateDisplay();
    }

    function deleteRecord(id) {
      if (!confirm("기록을 삭제할까요?")) return;

      let records = JSON.parse(localStorage.getItem("onItRecords")) || [];
      records = records.filter(r => r.id !== id);

      localStorage.setItem("onItRecords", JSON.stringify(records));
      renderRecords();
      updateDisplay();
    }

    function clearAllRecords() {
      const records = JSON.parse(localStorage.getItem("onItRecords")) || [];
      if (records.length === 0) {
        alert("삭제할 기록이 없습니다.");
        return;
      }

      if (confirm("정말로 모든 기록을 삭제하시겠습니까?\n이 작업은 복구할 수 없습니다.")) {
        localStorage.removeItem("onItRecords");
        renderRecords();
        updateDisplay();
        alert("모든 기록이 초기화되었습니다.");
      }
    }

    function exportRecordsCSV() {
      const records = JSON.parse(localStorage.getItem("onItRecords")) || [];
      if (records.length === 0) {
        alert("내보낼 기록이 없습니다.");
        return;
      }

      let csv = "\uFEFFDate,Type,Duration,Seconds\n";
      records.forEach(r => {
        csv += `${r.date},${r.type},${formatRecordText(r.seconds)},${r.seconds}\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `OnIt_Records_${getToday()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function triggerImportCSV() {
      document.getElementById("csvFileInput").click();
    }

    function importRecordsCSV(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        const lines = text.split("\n");
        const existingRecords = JSON.parse(localStorage.getItem("onItRecords")) || [];
        let importedCount = 0;

        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;

          const parts = line.split(",");
          if (parts.length >= 4) {
            const date = parts[0].trim();
            const type = parts[1].trim();
            const seconds = parseInt(parts[3].trim(), 10);

            if (date && !isNaN(seconds) && seconds > 0) {
              existingRecords.push({
                id: Date.now() + i + Math.floor(Math.random() * 1000),
                date: date,
                type: type || "On It",
                seconds: seconds
              });
              importedCount++;
            }
          }
        }

        if (importedCount > 0) {
          localStorage.setItem("onItRecords", JSON.stringify(existingRecords));
          renderRecords();
          updateDisplay();
          alert(`${importedCount}개의 기록을 성공적으로 불러왔습니다.`);
        } else {
          alert("유효한 CSV 데이터 형식이 아닙니다.");
        }
        input.value = "";
      };
      reader.readAsText(file);
    }

    window.addEventListener("DOMContentLoaded", () => {
      initPWA();
      loadBackgroundImage();
      renderTagChips();
      updateDisplay();
      setInterval(updateDisplay, 1000);
    });
  </script>
</body>
</html>
