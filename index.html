<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On It</title>
  
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="On It">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    :root {
      --font-main: "Trebuchet MS", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #f3eee4;
      color: #fff;
      font-family: var(--font-main);
    }

    body {
      min-height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .onit-page,
    .timer-page {
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .onit-page > *,
    .timer-page > * {
      position: relative;
      z-index: 1;
    }

    .background-readable {
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000,
         0   -1px 0 #000,
         0    1px 0 #000,
        -1px  0   0 #000,
         1px  0   0 #000;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      display: flex;
      align-items: center;
      padding: 18px 24px;
      background: transparent;
      border: none;
      z-index: 900;
      pointer-events: none;
    }

    .menu-button {
      background: none;
      border: none;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      padding: 0;
      margin: 0;
      pointer-events: auto;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    }

    .header-title { display: none; }

    .quick-memo-button {
      position: fixed;
      top: 58px;
      left: 20px;
      width: 34px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(9,9,9,.20);
      color: rgba(255,255,255,.86);
      font-size: 17px;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      z-index: 901;
      box-shadow: 0 4px 14px rgba(0,0,0,.22), inset 0 0 0 1px rgba(255,255,255,.025);
      text-shadow: 0 1px 3px rgba(0,0,0,.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .quick-memo-button:hover {
      border-color: rgba(255,255,255,.30);
      background: rgba(20,20,20,.28);
    }

    .quick-memo-panel {
      position: fixed;
      top: 58px;
      left: 64px;
      width: min(310px, calc(100vw - 82px));
      height: min(360px, calc(100vh - 82px));
      display: flex;
      flex-direction: column;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.20);
      background: rgba(18,18,18,.76);
      box-shadow: 0 12px 34px rgba(0,0,0,.36);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1100;
      opacity: 0;
      visibility: hidden;
      transform: translateX(-8px);
      transition: opacity .16s ease, transform .16s ease, visibility .16s ease;
    }

    .quick-memo-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
    }

    .quick-memo-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      color: rgba(255,255,255,.88);
      font-size: 13px;
    }

    .quick-memo-head-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .quick-memo-clear,
    .quick-memo-close {
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.66);
      cursor: pointer;
      padding: 4px 6px;
      font-size: 12px;
    }

    .quick-memo-close { font-size: 16px; }

    .quick-memo-text {
      flex: 1;
      width: 100%;
      min-height: 0;
      resize: none;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 10px;
      outline: none;
      padding: 11px;
      background: rgba(0,0,0,.20);
      color: #fff;
      font: inherit;
      font-size: 15px;
      line-height: 1.55;
      caret-color: #fff;
    }

    .quick-memo-text::placeholder { color: rgba(255,255,255,.34); }
    .quick-memo-text:focus { border-color: rgba(255,255,255,.24); }

    body:has(#recordsPage[style*="block"]) .quick-memo-button,
    body:has(#timeLogPage[style*="block"]) .quick-memo-button,
    body:has(#settingsPage[style*="block"]) .quick-memo-button {
      display: none;
    }

    @media (max-width: 600px) {
      .quick-memo-button {
        top: 54px;
        left: 14px;
        width: 32px;
        height: 27px;
      }
      .quick-memo-panel {
        top: 54px;
        left: 58px;
        width: calc(100vw - 74px);
        height: min(330px, calc(100vh - 72px));
      }
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background: #181818;
      padding: 60px 20px 20px;
      transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      border-right: 1px solid #2a2a2a;
    }

    .side-menu.open { left: 0; }

    .menu-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #888;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .menu-close-btn:hover { color: #fff; }

    .side-menu button.menu-item {
      width: 100%;
      padding: 16px 12px;
      margin-bottom: 8px;
      background: none;
      border: none;
      color: #fff;
      text-align: left;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
    }

    .side-menu button.menu-item:hover { background: #252525; }

    .tag-selector-wrapper,
    .preset-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 380px;
    }

    .tag-chips,
    .preset-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      max-height: 150px;
      overflow-y: auto;
      width: 100%;
    }

    .tag-chip,
    .preset-btn {
      padding: 6px 12px;
      background: rgba(15, 15, 15, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 16px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: none;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag-chip:hover,
    .preset-btn:hover {
      background: rgba(40, 40, 40, 0.9);
      border-color: #fff;
    }

    .tag-chip.selected {
      background: rgba(255, 255, 255, 0.95);
      border-color: #fff;
      color: #111;
      font-weight: 600;
      text-shadow: none;
      box-shadow: none;
    }

    .preset-del-btn {
      font-size: 11px;
      color: #ccc;
      cursor: pointer;
      margin-left: 2px;
      text-shadow: none;
    }

    .preset-del-btn:hover { color: #ff6b6b; }

    .preset-add-btn {
      padding: 6px 12px;
      background: rgba(15, 15, 15, 0.75);
      border: 1px dashed rgba(255, 255, 255, 0.5);
      border-radius: 15px;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      box-shadow: none;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    }

    .preset-add-btn:hover {
      border-color: #fff;
      background: rgba(40, 40, 40, 0.9);
    }

    .preset-dropdown {
      width: 100%;
      max-width: 380px;
      position: relative;
    }

    .preset-dropdown summary {
      list-style: none;
      cursor: pointer;
      padding: 8px 14px;
      border-radius: 18px;
      background: rgba(15, 15, 15, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: #fff;
      font-size: 13px;
      text-align: center;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
      user-select: none;
    }

    .preset-dropdown summary::-webkit-details-marker { display: none; }

    .preset-dropdown[open] summary {
      border-color: rgba(255,255,255,.8);
      border-radius: 18px 18px 10px 10px;
    }

    .preset-dropdown-panel {
      margin-top: 6px;
      padding: 8px;
      border-radius: 12px;
      background: rgba(15, 15, 15, 0.86);
      border: 1px solid rgba(255,255,255,.35);
      max-height: 220px;
      overflow-y: auto;
      backdrop-filter: blur(8px);
    }

    .preset-dropdown .preset-list {
      display: flex;
      flex-direction: column;
      flex-wrap: nowrap;
      max-height: none;
      overflow: visible;
      gap: 6px;
    }

    .preset-dropdown .preset-btn {
      width: 100%;
      justify-content: space-between;
      border-radius: 10px;
      padding: 8px 10px;
    }

    .preset-main {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .preset-total {
      opacity: .82;
      font-size: 12px;
      white-space: nowrap;
    }

    .preset-dropdown .preset-add-btn {
      width: 100%;
      margin-top: 8px;
      border-radius: 10px;
      padding: 8px 10px;
    }

    .timer-phase-info {
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .phase-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.88);
      background: rgba(255,255,255,.12);
      box-shadow: 0 1px 5px rgba(0,0,0,.75);
      box-sizing: border-box;
    }

    .phase-dot.done {
      background: rgba(255,255,255,.95);
      border-color: rgba(255,255,255,.95);
    }

    .phase-dot.current {
      width: 14px;
      height: 14px;
      border: 2px solid #fff;
      background: rgba(255,255,255,.28);
      box-shadow: 0 0 0 3px rgba(0,0,0,.20), 0 1px 7px rgba(0,0,0,.85);
    }

    .controls {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .control-button {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: linear-gradient(145deg, #232323, #161616);
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .control-button:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.3);
      background: linear-gradient(145deg, #2d2d2d, #1a1a1a);
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
    }

    .control-button:active {
      transform: translateY(1px);
      box-shadow: 0 3px 8px rgba(0,0,0,0.5);
    }

    /* 스타일리시한 노란색 형광 글로우 (세모 버튼 활성화 시) */
    .control-button.active-glow-play {
      border-color: rgba(255, 230, 80, 0.9);
      background: linear-gradient(145deg, #3a351a, #222012);
      box-shadow: 0 0 25px rgba(255, 220, 50, 0.55), inset 0 0 12px rgba(255, 220, 50, 0.25);
      color: #ffe650;
    }

    /* 스타일리시한 하늘색 형광 글로우 (일시정지 버튼 활성화 시) */
    .control-button.active-glow-pause {
      border-color: rgba(80, 210, 255, 0.9);
      background: linear-gradient(145deg, #1a323a, #121c22);
      box-shadow: 0 0 25px rgba(50, 200, 255, 0.55), inset 0 0 12px rgba(50, 200, 255, 0.25);
      color: #50d2ff;
    }

    .session-time {
      font-size: 72px;
      font-weight: 300;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .total-label {
      font-size: 16px;
      color: #fff;
      margin-bottom: 6px;
    }

    .total-time {
      font-size: 32px;
      font-weight: 300;
      margin-bottom: 20px;
    }

    .timer-inputs-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .timer-inputs {
      display: flex;
      gap: 12px;
    }

    .timer-input {
      width: 70px;
      height: 64px;
      background: rgba(15, 15, 15, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 14px;
      color: #fff;
      font-size: 24px;
      font-weight: 300;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    }

    .timer-input:focus { border-color: #fff; }

    .timer-remaining {
      font-size: 72px;
      font-weight: 300;
      letter-spacing: 1px;
      margin-bottom: 5px;
      transition: opacity 0.15s;
    }

    .timer-phase-info {
      font-size: 22px;
      color: #ddd;
      margin-bottom: 25px;
      font-weight: 300;
    }

    .text-flash { opacity: 0.1 !important; }

    .records-page {
      min-height: 100vh;
      padding: 80px 24px 40px;
      max-width: 700px;
      margin: 0 auto;
    }

    .records-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .records-toolbar button {
      padding: 9px 13px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1c1c1c;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .records-toolbar button:hover { background: #252525; }

    .records-toolbar button.btn-reset {
      border-color: rgba(255, 85, 85, 0.3);
      color: #ff6b6b;
    }

    .records-toolbar button.btn-reset:hover {
      background: rgba(255, 85, 85, 0.15);
      border-color: #ff5555;
    }

    #csvFileInput { display: none; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .summary-card {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
    }

    .summary-card-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
    }

    .summary-card-value {
      font-size: 18px;
      font-weight: 300;
      color: #fff;
    }

    .ratio-stats-box {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .ratio-stats-box details summary {
      font-size: 15px;
      color: #aaa;
      cursor: pointer;
      outline: none;
      user-select: none;
    }

    .ratio-stats-box details summary:hover {
      color: #fff;
    }

    .ratio-stats-content {
      margin-top: 14px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .ratio-item {
      margin-bottom: 10px;
    }

    .ratio-item:last-child { margin-bottom: 0; }

    .ratio-info-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
      color: #ccc;
    }

    .ratio-bar-bg {
      width: 100%;
      height: 6px;
      background: #252525;
      border-radius: 3px;
      overflow: hidden;
    }

    .ratio-bar-fill {
      height: 100%;
      background: #888;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .tag-manage-box {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .tag-manage-title {
      font-size: 15px;
      color: #aaa;
      margin-bottom: 10px;
    }

    .tag-manage-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-manage-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: #252525;
      border: 1px solid #333;
      border-radius: 14px;
      font-size: 13px;
      color: #fff;
    }

    .tag-manage-item span.del {
      color: #888;
      cursor: pointer;
      font-size: 11px;
    }
    .tag-manage-item span.del:hover { color: #ff6b6b; }

    .tag-add-input-group {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .tag-add-input-group input {
      flex: 1;
      padding: 6px 10px;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .tag-add-input-group button {
      padding: 6px 12px;
      background: #333;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .tag-add-input-group button:hover { background: #444; }

    .tag-filter-wrapper {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tag-filter-select {
      width: 100%;
      padding: 10px 12px;
      background: #181818;
      border: 1px solid #292929;
      color: #fff;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    .filter-options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #aaa;
      padding: 0 4px;
    }

    .filter-options-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .records-list { margin-top: 10px; }

    .record-date-container {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 25px;
      margin-bottom: 10px;
      border-bottom: 1px solid #222;
      padding-bottom: 5px;
    }

    .record-date {
      font-size: 18px;
      color: #888;
    }

    .record-date-total {
      font-size: 14px;
      color: #aaa;
      font-weight: 400;
    }

    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #1a1a1a;
      gap: 15px;
    }

    .record-main-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .record-row-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .record-time { font-size: 20px; }

    .record-type {
      color: #888;
      font-size: 13px;
      background: #222;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .record-memo {
      color: #ddd;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      width: fit-content;
    }

    .record-actions {
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    .record-actions button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 18px;
      cursor: pointer;
    }

    .record-actions button:hover { color: #fff; }

    .empty-records {
      color: #666;
      font-size: 16px;
      margin-top: 40px;
      text-align: center;
    }

    .settings-page {
      min-height: 100vh;
      padding: 80px 24px 40px;
      max-width: 700px;
      margin: 0 auto;
    }

    .settings-section { margin-top: 35px; }
    .settings-section:first-child { margin-top: 10px; }

    .settings-title {
      font-size: 20px;
      margin-bottom: 18px;
    }

    .settings-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid #222;
      gap: 20px;
    }

    .settings-option-label { font-size: 18px; }

    .settings-option button {
      min-width: 120px;
      padding: 12px 14px;
      border-radius: 8px;

    .timelog-datebar {

    .timelog-datebar button { padding: 8px 11px; font-size: 14px; }

    .timelog-date-label { min-width: 180px; text-align: center; font-size: 17px; color: #ddd; }

    .timelog-toolbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .timelog-toolbar button {
      padding: 11px 8px;
      font-size: 17px;
      font-weight: 700;
      transition: all .15s ease;
    }

    .timelog-toolbar button.active { outline: 2px solid rgba(255,255,255,.35); outline-offset: 1px; }
    .timelog-tool-o { color: #ff7a3d !important; }
    .timelog-tool-i { color: #59a8ff !important; font-family: Georgia, 'Times New Roman', serif; }
    .timelog-tool-x { color: #87917a !important; }
    .timelog-tool-erase { color: #ddd !important; }

    .timelog-grid-wrap {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .timelog-minutes-head, .timelog-row {
      display: grid;
      grid-template-columns: 38px repeat(6, 1fr) 38px;
      gap: 4px;
      align-items: center;
    }

    .timelog-minutes-head { margin-bottom: 5px; color: #777; font-size: 11px; text-align: center; }
    .timelog-hour { color: #8f8f8f; font-size: 13px; text-align: right; padding-right: 6px; }
    .timelog-hour-right { text-align: left; padding-right: 0; padding-left: 2px; }
    .timelog-cell {
      height: 24px;
      border: 1px solid #303030;
      border-radius: 4px;
      background: #151515;
      cursor: pointer;
      transition: background .08s ease, border-color .08s ease;
    }
    .timelog-cell.o { background: #d95d25; border-color: #ee7540; }
    .timelog-cell.i { background: #2d6faa; border-color: #4a8dcc; }
    .timelog-cell.x { background: #59604f; border-color: #727c64; }
    .timelog-cell.future-locked { opacity: .32; cursor: default; }

    .timelog-stats {
      display: grid;
      gap: 8px;
      margin-bottom: 15px;
    }
    .timelog-stat-row {
      background: #181818;

      align-items: center;

      flex-wrap: wrap;

    .timelog-stat-values {

      flex-wrap: wrap;
      align-items: center;

    .timelog-stat-values span { white-space: nowrap; }

      flex-wrap: wrap;

.timelog-stat-o { color: #ff8a55; }
    .timelog-stat-i { color: #69b4ff; }

    /* ===== Refined Focus UI: On It + Timer running ===== */
    .session-time,

    @media (max-width: 600px) {

    @media (max-width: 700px) {

        gap: 12px;
      }

        margin-left: 0 !important;
      }
    }

    .play-settings-row{display:flex;gap:7px;margin-bottom:8px}.play-settings-row:last-child{margin-bottom:0}
    .play-url-input,.play-fav-name{min-width:0;flex:1;height:38px;padding:0 11px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:rgba(255,255,255,.1);color:#fff;outline:none;font-size:13px}
    .play-tool-btn,.play-url-load{height:38px;padding:0 11px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:rgba(255,255,255,.10);color:#fff;cursor:pointer;font-size:12px;white-space:nowrap}.play-url-load{background:#fff;color:#222;font-weight:600}
    .play-tool-btn.danger{color:#ffd6d6}
    .play-fav-title{margin:11px 2px 7px;color:rgba(255,255,255,.68);font-size:11px;letter-spacing:.08em}
    .play-fav-list{display:flex;flex-direction:column;gap:6px}.play-fav-empty{padding:9px;color:rgba(255,255,255,.45);font-size:12px}
    .play-fav-item{display:flex;align-items:center;gap:6px;padding:6px 7px;border-radius:9px;background:rgba(255,255,255,.07)}
    .play-fav-main{min-width:0;flex:1;border:0;background:transparent;color:#fff;text-align:left;cursor:pointer;padding:3px}.play-fav-name-text{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.play-fav-url{display:block;margin-top:2px;color:rgba(255,255,255,.42);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .play-fav-edit,.play-fav-del{width:29px;height:29px;border:0;border-radius:7px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.72);cursor:pointer}.play-fav-del{color:#ffc7c7}
    .play-page.hud-hidden .play-hud{opacity:0;pointer-events:none;transform:translateY(-8px)}
    body:has(#playPage[style*="flex"]) .quick-memo-button{display:flex}
    @media(max-width:700px){.play-hud{right:14px;top:42px;width:210px}.play-hud-time{font-size:34px}.play-settings-toggle{left:14px}.play-settings-panel{left:14px;width:calc(100vw - 28px)}}

</style>
</head>

<body>

  <header>
    <button class="menu-button" onclick="toggleMenu()">☰</button>
    <div class="header-title" id="headerTitle">On It</div>
  </header>

  <button class="quick-memo-button" id="quickMemoButton" onclick="toggleQuickMemo()" aria-label="메모 열기">—</button>

  <aside class="quick-memo-panel" id="quickMemoPanel" aria-label="빠른 메모">
    <div class="quick-memo-head">
      <span>메모</span>
      <div class="quick-memo-head-actions">
        <button class="quick-memo-clear" onclick="clearQuickMemo()">비우기</button>
        <button class="quick-memo-close" onclick="closeQuickMemo()" aria-label="메모 닫기">✕</button>
      </div>
    </div>
    <textarea class="quick-memo-text" id="quickMemoText" placeholder="작업 중 잠깐 메모…" oninput="saveQuickMemo()"></textarea>
  </aside>

  <nav class="side-menu" id="sideMenu">
    <button class="menu-close-btn" onclick="closeMenu()">✕</button>
    <button class="menu-item" onclick="showOnIt()">Count Up</button>
    <button class="menu-item" onclick="showTimer()">Timer</button>
    <button class="menu-item" onclick="showPlay()">Play</button>
    <button class="menu-item" onclick="showRecords()">History</button>
    <button class="menu-item" onclick="showTimeLog()">Day Log</button>
    <button class="menu-item" onclick="showSettings()">Settings</button>
  </nav>

  <main class="onit-page" id="onitPage">
    <div class="tag-selector-wrapper" id="onitTagWrapper">
      <div class="tag-chips" id="onitTagChips"></div>
    </div>

    <div class="session-time background-readable" id="sessionTime">00&thinsp;00&thinsp;00</div>
    <div class="focus-subinfo background-readable" id="totalTime">TODAY · 0.0h</div>

    <div class="controls">
      <button class="control-button" id="onitPlayBtn" onclick="startSession()">▶</button>
      <button class="control-button" id="onitPauseBtn" onclick="pauseSession()">Ⅱ</button>
      <button class="control-button" onclick="stopSession()">■</button>
    </div>
  </main>

  <section class="timer-page" id="timerPage" style="display: none;"></section>

  <section class="play-page" id="playPage" style="display: none;">
    <div class="play-video-stage">
      <div class="play-video-empty" id="playVideoEmpty">YouTube 영상 또는 라이브 주소를 불러오면 여기에 재생됩니다.</div>
      <iframe id="playYoutubeFrame" title="YouTube player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
    </div>
    <div class="play-hud" id="playHud">
      <div class="play-hud-time background-readable" id="playHudTime">00&thinsp;00&thinsp;00</div>
      <div class="play-hud-sub background-readable" id="playHudSub">TODAY · 0.0h</div>
      <div class="controls" id="playControls"></div>
    </div>
    <button class="play-settings-toggle" id="playSettingsBtn" onclick="togglePlaySettings()" aria-label="PLAY 설정" title="PLAY 설정">⚙</button>
    <div class="play-settings-panel" id="playSettingsPanel">
      <div class="play-settings-row">
        <input class="play-url-input" id="playUrlInput" type="text" inputmode="url" placeholder="YouTube 영상 / 라이브 주소" onkeydown="if(event.key==='Enter') loadPlayYoutube()">
        <button class="play-url-load" onclick="loadPlayYoutube()">불러오기</button>
      </div>
      <div class="play-settings-row">
        <input class="play-fav-name" id="playFavName" type="text" placeholder="즐겨찾기 이름 · 예: 캠프파이어" onkeydown="if(event.key==='Enter') addPlayFavorite()">
        <button class="play-tool-btn" onclick="addPlayFavorite()">☆ 저장</button>
      </div>
      <div class="play-settings-row">
        <button class="play-tool-btn" id="playSoundBtn" onclick="togglePlaySound()">🔇 음소거</button>
        <button class="play-tool-btn" id="playHudToggleBtn" onclick="togglePlayHud()">타이머 숨김</button>
        <button class="play-tool-btn danger" onclick="stopPlayYoutube()">PLAY 종료</button>
      </div>
      <div class="play-fav-title">즐겨찾기</div>
      <div class="play-fav-list" id="playFavList"></div>
    </div>
  </section>

  <section class="records-page" id="recordsPage" style="display: none;">
    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-card-label">오늘</div>
        <div class="summary-card-value" id="todayTotalValue">0분</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-label">이번 주</div>
        <div class="summary-card-value" id="weekTotalValue">0분</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-label">이번 달</div>
        <div class="summary-card-value" id="monthTotalValue">0분</div>
      </div>
    </div>

    <div class="ratio-stats-box">
      <details>
        <summary>태그별 누적 시간 및 비율 (클릭하여 펼치기)</summary>
        <div class="ratio-stats-content" id="ratioStatsList"></div>
      </details>
    </div>

    <div class="tag-filter-wrapper">
      <select id="recordTagFilter" class="tag-filter-select" onchange="renderRecords()">
        <option value="ALL">모든 태그 (전체 보기)</option>
      </select>
      <div class="filter-options-row">
        <label>
          <input type="checkbox" id="currentMonthOnlyCheckbox" checked onchange="renderRecords()"> 이번 달만 보기
        </label>
      </div>
    </div>

    <div class="records-list" id="recordsList"></div>

  </section>



  <section class="timelog-page" id="timeLogPage" style="display: none;">
    <div class="timelog-datebar">
      <button onclick="changeTimeLogDate(-1)" aria-label="이전 날짜">‹</button>
      <div class="timelog-date-label" id="timelogDateLabel"></div>
      <button id="timelogNextBtn" onclick="changeTimeLogDate(1)" aria-label="다음 날짜">›</button>
      <button onclick="goTimeLogToday()">오늘</button>
      <button class="timelog-image-save-inline" onclick="saveTimeLogImage()">이미지 저장</button>
    </div>

    <div class="timelog-toolbar">
      <button class="timelog-tool-o" id="timelogToolO" onclick="setTimeLogTool('O')">O</button>
      <button class="timelog-tool-i" id="timelogToolI" onclick="setTimeLogTool('I')">I</button>
      <button class="timelog-tool-x" id="timelogToolX" onclick="setTimeLogTool('X')">X</button>
      <button class="timelog-tool-erase" id="timelogToolErase" onclick="setTimeLogTool('ERASE')">⌫</button>
    </div>

    <div class="timelog-grid-wrap" id="timelogGrid"></div>

    <div class="timelog-stats">
      <div class="timelog-stat-row">
        <span class="timelog-stat-label" id="timelogDayStatLabel">선택일</span>
        <div class="timelog-stat-values" id="timelogDayStats"></div>
      </div>
      <div class="timelog-stat-row">
        <span class="timelog-stat-label">이번 주</span>
        <div class="timelog-stat-values" id="timelogWeekStats"></div>
      </div>
      <div class="timelog-stat-row">
        <span class="timelog-stat-label">이번 달</span>
        <div class="timelog-stat-values" id="timelogMonthStats"></div>
      </div>
    </div>

  </section>


  <section class="settings-page" id="settingsPage" style="display: none;">
    <div class="settings-section data-management-section">
      <div class="settings-title">데이터 관리</div>
      <div class="settings-option data-management-row">
        <div class="settings-option-label">전체</div>
        <div class="data-management-actions">
          <button onclick="exportBackupJSON()">백업</button>
          <button onclick="triggerBackupJSONImport()">복원</button>
          <button class="backup-danger" onclick="clearIntegratedRecords()">초기화</button>
        </div>
      </div>
      <div class="settings-option data-management-row">
        <div class="settings-option-label">타이머</div>
        <div class="data-management-actions">
          <button onclick="exportRecordsCSV()">CSV 백업</button>
          <button onclick="triggerImportCSV()">CSV 복원</button>
          <button class="backup-danger" onclick="clearAllRecords()">초기화</button>
        </div>
      </div>
      <div class="settings-option data-management-row">
        <div class="settings-option-label">데이로그</div>
        <div class="data-management-actions">
          <button onclick="exportTimeLogCSVs()">CSV 백업</button>
          <button onclick="triggerTimeLogImport()">CSV 복원</button>
          <button class="backup-danger" onclick="clearAllTimeLogRecords()">초기화</button>
        </div>
      </div>
      <input type="file" id="backupJsonInput" accept=".json,application/json" onchange="importBackupJSON(this)">
      <input type="file" id="csvFileInput" accept=".csv" onchange="importRecordsCSV(this)">
      <input type="file" id="timelogCsvInput" accept=".csv" onchange="importTimeLogCSV(this)">
    </div>

    <div class="settings-section background-settings">
      <div class="settings-title">배경</div>
      <div class="background-preview-name" id="backgroundCurrentText">없음</div>
      <div class="background-buttons">
        <button onclick="selectBackgroundImage()">이미지 선택</button>
        <button onclick="removeBackgroundImage()">삭제</button>
      </div>
      <input id="backgroundFileInput" type="file" accept="image/*" onchange="handleBackgroundFile(this)">
    </div>

    <div class="settings-section">
      <div class="settings-title">알림</div>
      <div class="settings-option">
        <div class="settings-option-label">화면 깜빡임</div>
        <button id="flashAlertButton" onclick="setAlertMode('flash')">선택</button>
      </div>
      <div class="settings-option">
        <div class="settings-option-label">소리</div>
        <button id="soundAlertButton" onclick="setAlertMode('sound')">선택</button>
      </div>
      <div class="settings-current" id="currentAlertText">현재: 화면 깜빡임</div>
    </div>

    <div class="settings-section">
      <div class="settings-title">작업 태그 관리</div>
      <div class="tag-manage-box">
        <div class="tag-manage-list" id="tagManageList"></div>
        <div class="tag-add-input-group">
          <input type="text" id="newTagNameInput" placeholder="새 고정 태그 입력...">
          <button onclick="addNewTag()">추가</button>
        </div>
      </div>
    </div>
  </section>

  <script>
    function initPWA() {
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
        }, { once: true });
      }
    }

    const DEFAULT_TAGS = ["탐색", "설계", "생성", "편집", "IN"];
    let activeTag = localStorage.getItem("onItActiveTag") || "On It";

    function getCustomTags() {
      return JSON.parse(localStorage.getItem("onItCustomTags")) || DEFAULT_TAGS;
    }

    function saveCustomTags(tags) {
      localStorage.setItem("onItCustomTags", JSON.stringify(tags));
    }

    function renderTagChips() {
      const container = document.getElementById("onitTagChips");
      if (!container) return;
      const tags = getCustomTags();

      container.innerHTML = tags.map(t => `
        <button class="tag-chip ${activeTag === t ? 'selected' : ''}" onclick="selectActiveTag('${t}')">${t}</button>
      `).join("");
    }

    function selectActiveTag(tag) {
      activeTag = tag;
      localStorage.setItem("onItActiveTag", activeTag);
      renderTagChips();
      renderTimerTagChips();
    }

    function renderTagManagerUI() {
      const list = document.getElementById("tagManageList");
      if (!list) return;
      const tags = getCustomTags();

      list.innerHTML = tags.map(t => `
        <div class="tag-manage-item">
          ${t}
          ${tags.length > 1 ? `<span class="del" onclick="deleteTag('${t}')">✕</span>` : ''}
        </div>
      `).join("");
    }

    function addNewTag() {
      const input = document.getElementById("newTagNameInput");
      const val = input.value.trim();
      if (!val) return;

      let tags = getCustomTags();
      if (tags.includes(val)) {
        alert("이미 존재하는 태그입니다.");
        return;
      }

      tags.push(val);
      saveCustomTags(tags);
      input.value = "";
      renderTagManagerUI();
      renderTagChips();
      renderTimerTagChips();
    }

    function deleteTag(tag) {
      let tags = getCustomTags();
      if (tags.length <= 1) {
        alert("최소 하나의 태그는 유지되어야 합니다.");
        return;
      }

      tags = tags.filter(t => t !== tag);
      saveCustomTags(tags);

      if (activeTag === tag) {
        activeTag = tags[0];
        localStorage.setItem("onItActiveTag", activeTag);
      }

      renderTagManagerUI();
      renderTagChips();
      renderTimerTagChips();
    }

    function getToday() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}.${month}.${day}`;
    }

    function formatOnIt(seconds) {
      seconds = Math.max(0, Math.floor(Number(seconds) || 0));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      return `${String(hours).padStart(2, "0")}\u2009${String(minutes).padStart(2, "0")}\u2009${String(secs).padStart(2, "0")}`;
    }

    function formatTodayHours(seconds) {
      seconds = Math.max(0, Number(seconds) || 0);
      return `TODAY · ${(seconds / 3600).toFixed(1)}h`;
    }

    function formatRecordText(seconds) {
      seconds = Math.max(0, Math.floor(Number(seconds) || 0));
      if (seconds === 0) return "0분";

      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;

      let result = "";
      if (hours > 0) result += `${hours}시간 `;
      if (minutes > 0 || hours > 0) {
        result += `${minutes}분`;
      } else if (secs > 0) {
        result += `0분 ${secs}초`;
      }
      return result.trim();
    }

    function formatDayTotalText(seconds) {
      seconds = Math.max(0, Math.floor(Number(seconds) || 0));
      if (seconds === 0) return "0시간";
      
      const hoursDecimal = (seconds / 3600).toFixed(1);
      return `${hoursDecimal}시간`;
    }

    function formatTimer(seconds) {
      seconds = Math.max(0, Math.floor(Number(seconds) || 0));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;

      return (
        String(hours).padStart(2, "0") + "\u2009" +
        String(minutes).padStart(2, "0") + "\u2009" +
        String(secs).padStart(2, "0")
      );
    }

    const BACKGROUND_DB_NAME = "OnItBackgroundDB";
    const BACKGROUND_STORE_NAME = "background";
    const BACKGROUND_KEY = "current";
    let currentBackgroundUrl = null;

    function openBackgroundDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error("IndexedDB 지원 불가"));
          return;
        }
        const request = indexedDB.open(BACKGROUND_DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(BACKGROUND_STORE_NAME)) {
            db.createObjectStore(BACKGROUND_STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function updateBackgroundCurrentText(text) {
      const el = document.getElementById("backgroundCurrentText");
      if (el) el.textContent = text;
    }

    async function loadBackgroundImage() {
      try {
        const db = await openBackgroundDB();
        const tx = db.transaction(BACKGROUND_STORE_NAME, "readonly");
        const store = tx.objectStore(BACKGROUND_STORE_NAME);
        const request = store.get(BACKGROUND_KEY);

        request.onsuccess = () => {
          const file = request.result;
          db.close();

          if (currentBackgroundUrl) {
            URL.revokeObjectURL(currentBackgroundUrl);
            currentBackgroundUrl = null;
          }

          if (!file) {
            updateBackgroundCurrentText("없음");
            applyBackgroundToCurrentPage();
            return;
          }

          currentBackgroundUrl = URL.createObjectURL(file);
          updateBackgroundCurrentText(file.name || "선택한 이미지");
          applyBackgroundToCurrentPage();
        };
      } catch (err) {
        updateBackgroundCurrentText("없음");
      }
    }

    function applyBackgroundToCurrentPage() {
      const bg = currentBackgroundUrl ? `url("${currentBackgroundUrl}")` : "none";
      const onitPage = document.getElementById("onitPage");
      const timerPage = document.getElementById("timerPage");
      if (onitPage) onitPage.style.backgroundImage = bg;
      if (timerPage) timerPage.style.backgroundImage = bg;
    }

    function selectBackgroundImage() {
      document.getElementById("backgroundFileInput").click();
    }

    async function handleBackgroundFile(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      try {
        const db = await openBackgroundDB();
        const tx = db.transaction(BACKGROUND_STORE_NAME, "readwrite");
        const store = tx.objectStore(BACKGROUND_STORE_NAME);
        await store.put(file, BACKGROUND_KEY);
        db.close();
        await loadBackgroundImage();
      } catch (e) {
        alert("배경 이미지 저장에 실패했습니다.");
      }
      input.value = "";
    }

    async function removeBackgroundImage() {
      if (!confirm("배경 이미지를 삭제하시겠습니까?")) return;
      try {
        const db = await openBackgroundDB();
        const tx = db.transaction(BACKGROUND_STORE_NAME, "readwrite");
        tx.objectStore(BACKGROUND_STORE_NAME).delete(BACKGROUND_KEY);
        db.close();

        if (currentBackgroundUrl) {
          URL.revokeObjectURL(currentBackgroundUrl);
          currentBackgroundUrl = null;
        }
        updateBackgroundCurrentText("없음");
        applyBackgroundToCurrentPage();
      } catch (e) {
        alert("삭제 실패");
      }
    }

    function toggleMenu() {
      document.getElementById("sideMenu").classList.toggle("open");
    }

    function closeMenu() {
      document.getElementById("sideMenu").classList.remove("open");
    }

    const QUICK_MEMO_KEY = "onItQuickMemo";

    function loadQuickMemo() {
      const box = document.getElementById("quickMemoText");
      if (box) box.value = localStorage.getItem(QUICK_MEMO_KEY) || "";
    }

    function saveQuickMemo() {
      const box = document.getElementById("quickMemoText");
      if (box) localStorage.setItem(QUICK_MEMO_KEY, box.value);
    }

    function toggleQuickMemo() {
      const panel = document.getElementById("quickMemoPanel");
      if (!panel) return;
      const willOpen = !panel.classList.contains("open");
      panel.classList.toggle("open", willOpen);
      if (willOpen) {
        loadQuickMemo();
        setTimeout(() => document.getElementById("quickMemoText")?.focus(), 0);
      }
    }

    function closeQuickMemo() {
      document.getElementById("quickMemoPanel")?.classList.remove("open");
    }

    function clearQuickMemo() {
      const box = document.getElementById("quickMemoText");
      if (!box || !box.value) return;
      if (!confirm("메모 내용을 비울까요?")) return;
      box.value = "";
      localStorage.removeItem(QUICK_MEMO_KEY);
      box.focus();
    }

    function hideAllPages() {
      closeQuickMemo();
      document.getElementById("onitPage").style.display = "none";
      document.getElementById("timerPage").style.display = "none";
      document.getElementById("playPage").style.display = "none";
      document.getElementById("recordsPage").style.display = "none";
      document.getElementById("timeLogPage").style.display = "none";
      document.getElementById("settingsPage").style.display = "none";
    }

    function showOnIt() {
      hideAllPages();
      document.getElementById("onitPage").style.display = "flex";
      document.getElementById("headerTitle").textContent = "Count Up";

      renderTagChips();
      updateOnItStatus();
      updateDisplay();
      applyBackgroundToCurrentPage();
      closeMenu();
    }

    function showTimer() {
      hideAllPages();
      document.getElementById("timerPage").style.display = "flex";
      document.getElementById("headerTitle").textContent = "Timer";

      if (timerState === "running" || timerState === "paused") {
        showTimerRunningScreen();
      } else {
        showTimerSetupScreen();
      }

      applyBackgroundToCurrentPage();
      closeMenu();
    }

    function showRecords() {
      hideAllPages();
      document.getElementById("recordsPage").style.display = "block";

    // ===== Durable record storage (IndexedDB) =====
    const ONIT_DATA_DB = "ONIT_DATA_DB";
    const ONIT_DATA_DB_VERSION = 1;
    const ONIT_DATA_STORE = "data";
    let onItRecordsCache = [];
    let timeLogCache = {};
    let onItDataDb = null;

    function openOnItDataDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(ONIT_DATA_DB, ONIT_DATA_DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(ONIT_DATA_STORE)) db.createObjectStore(ONIT_DATA_STORE);
        };
        req.onsuccess = () => { onItDataDb = req.result; resolve(onItDataDb); };
        req.onerror = () => reject(req.error);
      });
    }
    function idbGet(key) {
      return new Promise((resolve, reject) => {
        const tx = onItDataDb.transaction(ONIT_DATA_STORE, "readonly");
        const req = tx.objectStore(ONIT_DATA_STORE).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    function idbSet(key, value) {
      return new Promise((resolve, reject) => {
        const tx = onItDataDb.transaction(ONIT_DATA_STORE, "readwrite");
        tx.objectStore(ONIT_DATA_STORE).put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    async function initOnItDataStorage() {
      await openOnItDataDB();
      let records = await idbGet("records");
      let timeLog = await idbGet("timeLog");
      // One-time migration from the former localStorage record stores.
      if (!Array.isArray(records)) {
        try { records = JSON.parse(localStorage.getItem("onItRecords")) || []; } catch (_) { records = []; }
        await idbSet("records", records);
      }
      if (!timeLog || typeof timeLog !== "object" || Array.isArray(timeLog)) {
        try { timeLog = JSON.parse(localStorage.getItem("onItTimeLogRecords")) || {}; } catch (_) { timeLog = {}; }
        await idbSet("timeLog", timeLog);
      }
      onItRecordsCache = records;
      timeLogCache = timeLog;
      // Remove legacy copies only after IndexedDB writes have succeeded.
      localStorage.removeItem("onItRecords");
      localStorage.removeItem("onItTimeLogRecords");
      localStorage.removeItem("onItTodoItems");
      localStorage.removeItem("onItTodoCompleted");
    }
    function loadRecordsData() { return onItRecordsCache; }
    async function saveRecordsData(records) {
      onItRecordsCache = Array.isArray(records) ? records : [];
      if (!onItDataDb) throw new Error("IndexedDB is not ready");
      await idbSet("records", onItRecordsCache);
    }

    const ACTIVE_SESSION_KEY = "onItActiveSessionV1";
    let activeSessionId = null;

    function newActiveSessionId() {
      return `${Date.now()}-${Math.random().toString(36).slice(2,10)}`;
    }

    function saveActiveSessionCheckpoint() {
      try {
        if (onItState === "running" || onItState === "paused" || sessionSeconds > 0) {
          localStorage.setItem(ACTIVE_SESSION_KEY, JSON.stringify({
            v: 1, mode: "onit", id: activeSessionId, state: onItState,
            sessionSeconds, startTime: onItStartTime, tag: activeTag
          }));
          return;
        }
        if (timerState === "running" || timerState === "paused") {
          localStorage.setItem(ACTIVE_SESSION_KEY, JSON.stringify({
            v: 1, mode: "timer", id: activeSessionId, state: timerState,
            phases: timerPhases, phaseIndex: currentPhaseIndex,
            phaseStartTime: timerPhaseStartTime,
            phaseRemaining: timerPhaseRemainingAtPause,
            totalElapsed: timerTotalElapsed, tag: activeTag
          }));
          return;
        }
        localStorage.removeItem(ACTIVE_SESSION_KEY);
      } catch (e) { console.error("session checkpoint failed", e); }
    }

    function clearActiveSessionCheckpoint() {
      try { localStorage.removeItem(ACTIVE_SESSION_KEY); } catch (_) {}
      activeSessionId = null;
    }

    function hasSavedSessionRecord(id) {
      return !!id && loadRecordsData().some(r => r.sessionId === id);
    }

    function restoreActiveSessionCheckpoint() {
      let c = null;
      try { c = JSON.parse(localStorage.getItem(ACTIVE_SESSION_KEY) || "null"); } catch (_) {}
      if (!c || c.v !== 1 || !c.id) return;
      if (hasSavedSessionRecord(c.id)) { clearActiveSessionCheckpoint(); return; }

      activeSessionId = c.id;
      if (c.tag && getCustomTags().includes(c.tag)) {
        activeTag = c.tag;
        localStorage.setItem("onItActiveTag", activeTag);
      }

      if (c.mode === "onit") {
        sessionSeconds = Math.max(0, Number(c.sessionSeconds) || 0);
        onItStartTime = Number(c.startTime) || null;
        onItState = c.state === "running" && onItStartTime ? "running" : "paused";
        updateOnItStatus();
      } else if (c.mode === "timer" && Array.isArray(c.phases) && c.phases.length) {
        timerPhases = c.phases.map(v => Math.max(0, Number(v) || 0)).filter(Boolean);
        currentPhaseIndex = Math.min(Math.max(0, Number(c.phaseIndex) || 0), timerPhases.length - 1);
        timerPhaseStartTime = Number(c.phaseStartTime) || null;
        timerPhaseRemainingAtPause = Math.max(0, Number(c.phaseRemaining) || 0);
        timerTotalElapsed = Math.max(0, Number(c.totalElapsed) || 0);
        timerState = c.state === "running" && timerPhaseStartTime ? "running" : "paused";
        if (timerState === "running") runTimerLoop();
      }
    }

    let onItState = "idle";
    let sessionSeconds = 0;
    let onItStartTime = null;

    function getTodayTotalSeconds() {
      const records = loadRecordsData();
      const today = getToday();
      return records
        .filter(r => r.date === today)
        .reduce((sum, r) => sum + (Number(r.seconds) || 0), 0);
    }

    function getCurrentOnItElapsed() {
      if (onItState === "running" && onItStartTime !== null) {
        const diff = Math.floor((Date.now() - onItStartTime) / 1000);
        return sessionSeconds + diff;
      }
      return sessionSeconds;
    }

    function updateOnItStatus() {
      const playBtn = document.getElementById("onitPlayBtn");
      const pauseBtn = document.getElementById("onitPauseBtn");
      const tagWrapper = document.getElementById("onitTagWrapper");

      if (playBtn) playBtn.classList.remove("active-glow-play");
      if (pauseBtn) pauseBtn.classList.remove("active-glow-pause");

      if (onItState === "running") {
        if (playBtn) playBtn.classList.add("active-glow-play");
        if (tagWrapper) tagWrapper.style.display = "none";
      } else if (onItState === "paused" || sessionSeconds > 0) {
        if (pauseBtn) pauseBtn.classList.add("active-glow-pause");
        if (tagWrapper) tagWrapper.style.display = "none";
      } else {
        if (tagWrapper) tagWrapper.style.display = "flex";
      }
    }

    function updateDisplay() {
      const currentSession = getCurrentOnItElapsed();
      document.getElementById("sessionTime").textContent = formatOnIt(currentSession);

      let todayTotal = getTodayTotalSeconds();
      if (onItState === "running") {
        todayTotal += (currentSession - sessionSeconds);
      }

      document.getElementById("totalTime").textContent = formatTodayHours(todayTotal);
      updatePlayDisplay();
    }

    function startSession() {
      if (timerState === "running" || timerState === "paused") {
        if (!confirm("타이머가 작동 중입니다. On It을 시작할까요?")) return;
        stopTimer();
      }

      if (onItState !== "running") {
        if (!activeSessionId) activeSessionId = newActiveSessionId();
        onItStartTime = Date.now();
        onItState = "running";
        saveActiveSessionCheckpoint();
      }

      updateOnItStatus();
      updateDisplay();
    }

    function pauseSession() {
      if (onItState !== "running") return;
      sessionSeconds = getCurrentOnItElapsed();
      onItState = "paused";
      onItStartTime = null;
      saveActiveSessionCheckpoint();

      updateOnItStatus();
      updateDisplay();
    }

    async function stopSession() {
      if (onItState === "running") {
        sessionSeconds = getCurrentOnItElapsed();
      }

      const secondsToSave = sessionSeconds;
      const sessionIdToSave = activeSessionId;
      const tagToSave = activeTag;

      sessionSeconds = 0;
      onItState = "idle";
      onItStartTime = null;

      if (secondsToSave > 0) {
        try {
          await saveRecord(secondsToSave, getToday(), tagToSave, "", sessionIdToSave);
          clearActiveSessionCheckpoint();
        } catch (e) {
          console.error(e);
          alert("기록 저장이 완료되지 않았습니다. 앱을 다시 열면 진행 중 기록을 복구할 수 있습니다.");
        }
      } else {
        clearActiveSessionCheckpoint();
      }

      updateOnItStatus();
      updateDisplay();
    }

    let timerState = "idle";
    let timerPhases = [];
    let currentPhaseIndex = 0;
    let timerPhaseStartTime = null;
    let timerPhaseRemainingAtPause = 0;
    let timerTotalElapsed = 0;
    let timerLoop = null;

    const DEFAULT_PRESETS = [
      { id: "p1", name: "25 / 5 / 25 / 5", values: [25, 5, 25, 5] },
      { id: "p2", name: "50 / 10 / 50 / 10", values: [50, 10, 50, 10] },
      { id: "p3", name: "10 / 2 / 10 / 2", values: [10, 2, 10, 2] }
    ];

    function getCustomPresets() {
      return JSON.parse(localStorage.getItem("onItTimerPresets")) || DEFAULT_PRESETS;
    }

    function saveCustomPresets(presets) {
      localStorage.setItem("onItTimerPresets", JSON.stringify(presets));
    }

    const TIMER_LAST_RUN_KEY = "onItTimerLastRun";

    function getLastTimerRun() {
      try {
        const saved = JSON.parse(localStorage.getItem(TIMER_LAST_RUN_KEY));
        if (Array.isArray(saved) && saved.length === 4) {
          return saved.map(v => Math.max(0, parseInt(v) || 0));
        }
      } catch (e) {}
      return [25, 5, 25, 5];
    }

    function saveLastTimerRun(values) {
      localStorage.setItem(TIMER_LAST_RUN_KEY, JSON.stringify(values));
    }

    function applyPreset(m1, m2, m3, m4) {
      const i1 = document.getElementById("tMin1");
      const i2 = document.getElementById("tMin2");
      const i3 = document.getElementById("tMin3");
      const i4 = document.getElementById("tMin4");
      if (i1 && i2 && i3 && i4) {
        i1.value = m1;
        i2.value = m2;
        i3.value = m3;
        i4.value = m4;
      }
    }

    function addCurrentAsPreset() {
      const m1 = Math.max(0, parseInt(document.getElementById("tMin1").value) || 0);
      const m2 = Math.max(0, parseInt(document.getElementById("tMin2").value) || 0);
      const m3 = Math.max(0, parseInt(document.getElementById("tMin3").value) || 0);
      const m4 = Math.max(0, parseInt(document.getElementById("tMin4").value) || 0);

      if (m1 === 0 && m2 === 0 && m3 === 0 && m4 === 0) {
        alert("최소 하나의 분 시간을 입력하세요.");
        return;
      }

      const presets = getCustomPresets();
      const newPreset = {
        id: "custom_" + Date.now(),
        name: `${m1} / ${m2} / ${m3} / ${m4}`,
        values: [m1, m2, m3, m4]
      };

      presets.push(newPreset);
      saveCustomPresets(presets);
      showTimerSetupScreen();
    }

    function deletePreset(id, event) {
      event.stopPropagation();
      let presets = getCustomPresets();
      presets = presets.filter(p => p.id !== id);
      saveCustomPresets(presets);
      showTimerSetupScreen();
    }

    function renderTimerTagChips() {
      const container = document.getElementById("timerTagChips");
      if (!container) return;
      const tags = getCustomTags();

      container.innerHTML = tags.map(t => `
        <button class="tag-chip ${activeTag === t ? 'selected' : ''}" onclick="selectActiveTag('${t}'); renderTimerTagChips();">${t}</button>
      `).join("");
    }

    function showTimerSetupScreen() {
      const page = document.getElementById("timerPage");
      const presets = getCustomPresets();
      const tags = getCustomTags();
      const lastRun = getLastTimerRun();

      let presetButtonsHtml = presets.map(p => {
        const vals = [p.values[0] || 0, p.values[1] || 0, p.values[2] || 0, p.values[3] || 0];

          <button class="preset-btn" onclick="applyPreset(${vals[0]}, ${vals[1]}, ${vals[2]}, ${vals[3]})">

            <span class="preset-del-btn" onclick="deletePreset('${p.id}', event)">✕</span>
          </button>
        `;
      }).join("");

      let tagChipsHtml = tags.map(t => `
        <button class="tag-chip ${activeTag === t ? 'selected' : ''}" onclick="selectActiveTag('${t}'); renderTimerTagChips();">${t}</button>
      `).join("");

      page.innerHTML = `
        <div class="tag-selector-wrapper" style="margin-bottom:15px;">
          <div class="tag-chips" id="timerTagChips">
            ${tagChipsHtml}
          </div>
        </div>

        <div class="timer-inputs-wrapper">
          <div class="timer-inputs">
            <input type="number" id="tMin1" class="timer-input" value="${lastRun[0]}" min="0">
            <input type="number" id="tMin2" class="timer-input" value="${lastRun[1]}" min="0">
            <input type="number" id="tMin3" class="timer-input" value="${lastRun[2]}" min="0">
            <input type="number" id="tMin4" class="timer-input" value="${lastRun[3]}" min="0">
          </div>
        </div>

        <div class="preset-container">
          <details class="preset-dropdown">
            <summary>프리셋 ▾</summary>
            <div class="preset-dropdown-panel">
              <div class="preset-list">
                ${presetButtonsHtml}
              </div>
              <button class="preset-add-btn" onclick="addCurrentAsPreset()">+ 현재 설정 저장</button>
            </div>
          </details>
        </div>

        <button class="control-button timer-setup-play" onclick="startTimerSetup()">▶</button>
      `;
    }

    function showTimerRunningScreen() {
      const page = document.getElementById("timerPage");
      page.innerHTML = `
        <div class="timer-remaining background-readable" id="timerRemainingDisplay">00&thinsp;00&thinsp;00</div>
        <div class="timer-phase-info" id="timerPhaseInfo" aria-label="타이머 진행 단계"></div>
        <div class="controls">
          <button class="control-button" id="timerPlayBtn" onclick="resumeTimer()">▶</button>
          <button class="control-button" id="timerPauseBtn" onclick="pauseTimer()">Ⅱ</button>
          <button class="control-button" onclick="stopTimer()">■</button>
        </div>
      `;
      updateTimerRunningDisplay();
    }

    function updateTimerRunningDisplay() {
      const display = document.getElementById("timerRemainingDisplay");
      const phaseInfo = document.getElementById("timerPhaseInfo");
      const playBtn = document.getElementById("timerPlayBtn");
      const pauseBtn = document.getElementById("timerPauseBtn");

      if (!display || !phaseInfo) return;

      if (playBtn) playBtn.classList.remove("active-glow-play");
      if (pauseBtn) pauseBtn.classList.remove("active-glow-pause");

      if (timerState === "running") {
        if (playBtn) playBtn.classList.add("active-glow-play");
      } else if (timerState === "paused") {
        if (pauseBtn) pauseBtn.classList.add("active-glow-pause");
      }

      let currentPhaseSec = 0;
      if (timerState === "running" && timerPhaseStartTime !== null) {
        const elapsedSinceStart = Math.floor((Date.now() - timerPhaseStartTime) / 1000);
        currentPhaseSec = Math.max(0, timerPhaseRemainingAtPause - elapsedSinceStart);
      } else {
        currentPhaseSec = timerPhaseRemainingAtPause;
      }

      display.textContent = formatTimer(currentPhaseSec);
      phaseInfo.innerHTML = timerPhases.map((_, i) => {
        const stateClass = i < currentPhaseIndex ? "done" : (i === currentPhaseIndex ? "current" : "");
        return `<span class="phase-dot ${stateClass}"></span>`;
      }).join("");
      phaseInfo.setAttribute("aria-label", `${currentPhaseIndex + 1} / ${timerPhases.length} 단계`);
      updatePlayDisplay();
    }

    function startTimerSetup() {
      if (onItState === "running" || onItState === "paused" || sessionSeconds > 0) {
        if (!confirm("On It이 작동 중입니다. 타이머를 시작할까요?")) return;
        stopSession();
      }

      const m1 = Math.max(0, parseInt(document.getElementById("tMin1").value) || 0);
      const m2 = Math.max(0, parseInt(document.getElementById("tMin2").value) || 0);
      const m3 = Math.max(0, parseInt(document.getElementById("tMin3").value) || 0);
      const m4 = Math.max(0, parseInt(document.getElementById("tMin4").value) || 0);

      const phasesInSec = [m1 * 60, m2 * 60, m3 * 60, m4 * 60].filter(sec => sec > 0);

      if (phasesInSec.length === 0) {
        alert("최소 하나의 구간에 분 시간을 입력해주세요.");
        return;
      }

      saveLastTimerRun([m1, m2, m3, m4]);
      ensureTimerNotificationPermission();

      timerPhases = phasesInSec;
      currentPhaseIndex = 0;
      timerTotalElapsed = 0;
      timerPhaseRemainingAtPause = timerPhases[0];
      timerPhaseStartTime = Date.now();
      timerState = "running";
      activeSessionId = newActiveSessionId();
      saveActiveSessionCheckpoint();

      showTimerRunningScreen();
      runTimerLoop();
    }

    function syncTimerToNow({ alertOnCross = true } = {}) {
      if (timerState !== "running" || timerPhaseStartTime === null || !timerPhases.length) return;

      const now = Date.now();
      let elapsedSinceStart = Math.max(0, Math.floor((now - timerPhaseStartTime) / 1000));
      let currentPhaseSec = timerPhaseRemainingAtPause - elapsedSinceStart;
      let crossedPhase = false;

      // 브라우저/OS가 백그라운드 JS를 멈췄다가 다시 실행해도 벽시계 기준으로 즉시 따라잡는다.
      while (currentPhaseSec <= 0 && timerState === "running") {
        crossedPhase = true;
        timerTotalElapsed += timerPhaseRemainingAtPause;
        elapsedSinceStart -= timerPhaseRemainingAtPause;
        currentPhaseIndex++;

        if (currentPhaseIndex >= timerPhases.length) {
          // 최종 완료 알림은 finishTimer 전에 정확히 한 번 발생시킨다.
          if (alertOnCross) triggerTimerAlert(true);
          finishTimer();
          return;
        }

        timerPhaseRemainingAtPause = timerPhases[currentPhaseIndex];
        currentPhaseSec = timerPhaseRemainingAtPause - elapsedSinceStart;
      }

      if (crossedPhase) {
        // 여러 구간을 건너뛴 경우에도 현재 구간의 실제 시작시각을 복원한다.
        timerPhaseStartTime = now - (elapsedSinceStart * 1000);
        saveActiveSessionCheckpoint();
        if (alertOnCross) triggerTimerAlert(false);
      }

      updateTimerRunningDisplay();
      updateDisplay();
    }

    function runTimerLoop() {
      if (timerLoop) clearInterval(timerLoop);
      // 시작/복구 직후에도 500ms를 기다리지 않고 현재 시각으로 맞춘다.
      syncTimerToNow();
      if (timerState !== "running") return;

      timerLoop = setInterval(() => {
        syncTimerToNow();
      }, 500);
    }

    function syncRunningClocksAfterResume() {
      // Count Up은 Date.now() 기반이라 updateDisplay만 해도 실제 경과시간으로 즉시 복구된다.
      if (timerState === "running") syncTimerToNow();
      else updateDisplay();
      saveActiveSessionCheckpoint();
    }

    function pauseTimer() {
      if (timerState !== "running") return;
      
      const elapsedSinceStart = Math.floor((Date.now() - timerPhaseStartTime) / 1000);
      timerPhaseRemainingAtPause = Math.max(0, timerPhaseRemainingAtPause - elapsedSinceStart);
      timerState = "paused";
      timerPhaseStartTime = null;
      saveActiveSessionCheckpoint();

      updateTimerRunningDisplay();
    }

    function resumeTimer() {
      if (timerState === "paused") {
        timerState = "running";
        timerPhaseStartTime = Date.now();
        saveActiveSessionCheckpoint();

        updateTimerRunningDisplay();
      }
    }

    async function stopTimer() {
      if (timerLoop) { clearInterval(timerLoop); timerLoop = null; }

      if (timerState === "finished") {
        timerState = "idle";
        clearActiveSessionCheckpoint();
        showTimerSetupScreen();
        updateDisplay();
        return;
      }

      let actualElapsed = timerTotalElapsed;
      if (timerState === "running") {
        const elapsedSinceStart = Math.floor((Date.now() - timerPhaseStartTime) / 1000);
        const currentRemaining = Math.max(0, timerPhaseRemainingAtPause - elapsedSinceStart);
        actualElapsed += (timerPhases[currentPhaseIndex] - currentRemaining);
      } else if (timerState === "paused") {
        actualElapsed += (timerPhases[currentPhaseIndex] - timerPhaseRemainingAtPause);
      }

      const sessionIdToSave = activeSessionId;
      const tagToSave = activeTag;
      timerState = "idle";
      timerPhaseStartTime = null;

      if (actualElapsed > 0) {
        try {
          await saveRecord(actualElapsed, getToday(), tagToSave, "", sessionIdToSave);
          clearActiveSessionCheckpoint();
        } catch (e) {
          console.error(e);
          alert("기록 저장이 완료되지 않았습니다. 앱을 다시 열면 진행 중 기록을 복구할 수 있습니다.");
        }
      } else {
        clearActiveSessionCheckpoint();
      }

      showTimerSetupScreen();
      updateDisplay();
    }

    async function finishTimer() {
      if (timerLoop) {
        clearInterval(timerLoop);
        timerLoop = null;
      }

      const completedElapsed = timerPhases.reduce((sum, sec) => sum + sec, 0);
      const sessionIdToSave = activeSessionId;
      const tagToSave = activeTag;

      timerTotalElapsed = 0;
      timerPhaseRemainingAtPause = 0;
      timerState = "finished";
      timerPhaseStartTime = null;

      if (completedElapsed > 0) {
        try {
          await saveRecord(completedElapsed, getToday(), tagToSave, "", sessionIdToSave);
          clearActiveSessionCheckpoint();
        } catch (e) {
          console.error(e);
          alert("완료 기록 저장이 끝나지 않았습니다. 앱을 다시 열면 복구할 수 있습니다.");
        }
      } else {
        clearActiveSessionCheckpoint();
      }

      const display = document.getElementById("timerRemainingDisplay");
      if (display) display.textContent = formatTimer(0);
      updateTimerRunningDisplay();
      updateDisplay();
    }

    function ensureTimerNotificationPermission() {
      if (!("Notification" in window)) return;
      if (Notification.permission === "default") {
        Notification.requestPermission().catch(() => {});
      }
    }

    async function showBackgroundTimerNotification(isFinalPhase = false) {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      if (!("serviceWorker" in navigator)) return;

      const title = isFinalPhase ? "On It · Timer complete" : "On It · Timer";
      const body = isFinalPhase
        ? "타이머가 완료되었습니다."
        : `${currentPhaseIndex + 1} / ${timerPhases.length} 구간이 끝났습니다.`;

      try {
        const registration = await navigator.serviceWorker.ready;
        await registration.showNotification(title, {
          body,
          icon: "./icon-192.png",
          badge: "./icon-192.png",

    function playAlertSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        function playBeep(freq, startTime, duration, volume = 0.32) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0.001, startTime);
          gain.gain.linearRampToValueAtTime(volume, startTime + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        }

        const now = ctx.currentTime;
        const notes = [
          [880, 0.00, 0.08],
          [1046, 0.11, 0.08],
          [1318, 0.22, 0.08],
          [1568, 0.33, 0.18]
        ];
        const repeatGap = 0.62;

        for (let r = 0; r < 4; r++) {
          notes.forEach(([freq, offset, duration]) => {
            playBeep(freq, now + r * repeatGap + offset, duration);
          });
        }

        setTimeout(() => ctx.close(), 3000);
      } catch (e) {}
    }

    function parseDateStr(dateStr) {
      const parts = dateStr.split(".");
      return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    }

    function getRangeTotals() {
      const records = loadRecordsData();
      const now = new Date();
      const todayStr = getToday();

      const currentDay = now.getDay();
      const diffToMon = now.getDate() - currentDay + (currentDay === 0 ? -6 : 1);
      const monday = new Date(now.setDate(diffToMon));
      monday.setHours(0, 0, 0, 0);

      const currentYear = new Date().getFullYear();
      const currentMonth = new Date().getMonth();

      let todaySec = 0;
      let weekSec = 0;
      let monthSec = 0;

      records.forEach(r => {
        const sec = Number(r.seconds) || 0;
        const rDate = parseDateStr(r.date);

        if (r.date === todayStr) todaySec += sec;
        if (rDate >= monday) weekSec += sec;
        if (rDate.getFullYear() === currentYear && rDate.getMonth() === currentMonth) {
          monthSec += sec;
        }
      });

      return { todaySec, weekSec, monthSec };
    }

    async function saveRecord(seconds, date, type = "On It", memo = "", sessionId = null) {
      seconds = Math.max(0, Math.floor(Number(seconds) || 0));
      if (seconds <= 0) return;

      const records = loadRecordsData();
      if (sessionId && records.some(r => r.sessionId === sessionId)) return;

      records.push({
        id: Date.now() + Math.floor(Math.random() * 1000),
        date: date || getToday(),
        seconds: seconds,
        type: type,
        memo: memo || "",
        ...(sessionId ? { sessionId } : {})
      });

      await saveRecordsData(records);
    }

    function renderRatioStats(records) {
      const container = document.getElementById("ratioStatsList");
      if (!container) return;

      if (records.length === 0) {
        container.innerHTML = `<div style="color:#777; font-size:13px; text-align:center;">데이터가 없습니다.</div>`;
        return;
      }

      const activeTags = getCustomTags();
      const tagTotals = {};
      let totalAllSec = 0;

      records.forEach(r => {
        const t = r.type || "On It";
        if (activeTags.includes(t)) {
          const sec = Number(r.seconds) || 0;
          tagTotals[t] = (tagTotals[t] || 0) + sec;
          totalAllSec += sec;
        }
      });

      if (totalAllSec === 0) {
        container.innerHTML = `<div style="color:#777; font-size:13px; text-align:center;">데이터가 없습니다.</div>`;
        return;
      }

      const sortedTags = Object.keys(tagTotals).sort((a, b) => tagTotals[b] - tagTotals[a]);

      container.innerHTML = sortedTags.map(tag => {
        const sec = tagTotals[tag];
        const percent = ((sec / totalAllSec) * 100).toFixed(1);
        return `
          <div class="ratio-item">
            <div class="ratio-info-row">
              <span>${tag}</span>
              <span>${formatRecordText(sec)} (${percent}%)</span>
            </div>
            <div class="ratio-bar-bg">
              <div class="ratio-bar-fill" style="width: ${percent}%;"></div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderRecords() {
      const listContainer = document.getElementById("recordsList");
      const todayEl = document.getElementById("todayTotalValue");
      const weekEl = document.getElementById("weekTotalValue");
      const monthEl = document.getElementById("monthTotalValue");
      const filterSelect = document.getElementById("recordTagFilter");
      const monthOnlyCheckbox = document.getElementById("currentMonthOnlyCheckbox");

      const records = loadRecordsData();
      const activeTags = getCustomTags();
      
      if (filterSelect) {
        const currentFilterVal = filterSelect.value;
        filterSelect.innerHTML = `<option value="ALL">모든 태그 (전체 보기)</option>` +
          activeTags.map(t => `<option value="${t}" ${currentFilterVal === t ? 'selected' : ''}>${t}</option>`).join("");
      }

      const selectedFilter = filterSelect ? filterSelect.value : "ALL";
      
      let filteredRecords = selectedFilter === "ALL" 
        ? records.filter(r => activeTags.includes(r.type || "On It")) 
        : records.filter(r => r.type === selectedFilter);

      if (monthOnlyCheckbox && monthOnlyCheckbox.checked) {
        const now = new Date();
        const curY = now.getFullYear();
        const curM = now.getMonth();
        filteredRecords = filteredRecords.filter(r => {
          const d = parseDateStr(r.date);
          return d.getFullYear() === curY && d.getMonth() === curM;
        });
      }

      const { todaySec, weekSec, monthSec } = getRangeTotals();
      if (todayEl) todayEl.textContent = formatRecordText(todaySec);
      if (weekEl) weekEl.textContent = formatRecordText(weekSec);
      if (monthEl) monthEl.textContent = formatRecordText(monthSec);

      renderRatioStats(records);

      if (!listContainer) return;

      if (filteredRecords.length === 0) {
        listContainer.innerHTML = `<div class="empty-records">기록이 없습니다.</div>`;
        return;
      }

      const grouped = {};
      filteredRecords.forEach(r => {
        if (!grouped[r.date]) grouped[r.date] = [];
        grouped[r.date].push(r);
      });

      const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));
      let html = "";

      sortedDates.forEach(date => {
        const dayTotalSec = grouped[date].reduce((sum, item) => sum + (Number(item.seconds) || 0), 0);
        const dayTotalString = formatDayTotalText(dayTotalSec);

        html += `
          <div class="record-date-container">
            <div class="record-date">${date}</div>
            <div class="record-date-total">${dayTotalString}</div>
          </div>
        `;

        grouped[date].forEach(item => {
          const displayText = formatRecordText(item.seconds);
          const memoHtml = item.memo ? `<div class="record-memo">💬 ${item.memo}</div>` : '';
          html += `
            <div class="record-item">
              <div class="record-main-info">
                <div class="record-row-top">
                  <span class="record-time">${displayText}</span>
                  <span class="record-type">${item.type}</span>
                </div>
                ${memoHtml}
              </div>
              <div class="record-actions">
                <button onclick="editRecord(${item.id})" title="수정">✎</button>
                <button onclick="deleteRecord(${item.id})" title="삭제">✕</button>
              </div>
            </div>
          `;
        });
      });

      listContainer.innerHTML = html;
    }

    function importRecordsCSV(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        const lines = text.split("\n");
        const existingRecords = loadRecordsData();
        let importedCount = 0;

        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;

          const parts = line.split(",");
          if (parts.length >= 4) {
            const date = parts[0].trim();
            const type = parts[1].trim();
            const seconds = parseInt(parts[3].trim(), 10);
            const memo = parts[4] ? parts[4].trim() : "";

            if (date && !isNaN(seconds) && seconds > 0) {
              existingRecords.push({
                id: Date.now() + i + Math.floor(Math.random() * 1000),
                date: date,
                type: type || "On It",
                seconds: seconds,
                memo: memo
              });
              importedCount++;
            }
          }
        }

        if (importedCount > 0) {
          saveRecordsData(existingRecords);
          renderRecords();
          updateDisplay();
          alert(`${importedCount}개의 기록을 성공적으로 불러왔습니다.`);
        } else {
          alert("유효한 CSV 데이터 형식이 아닙니다.");
        }
        input.value = "";
      };
      reader.readAsText(file);
    }
